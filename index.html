<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三大学 日本史ドリル</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日本史ドリル">
<meta name="theme-color" content="#24427a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: スマホ縦1画面(9:16)。上=条件バー、中=問題(この中だけスクロール)、下=解答バー固定 */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#1c2230; --muted:#5d6577; --line:#dde1e9;
  --ai:#24427a; --ai-ink:#ffffff; --ai-soft:#e6ecf7; --paper:#f7f4ec; --paper-line:#e2dccd;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --ng:#b3261e; --ng-soft:#fbe7e5; --scrim:rgba(20,24,34,.45);
  --doshi:#5b2d8a; --ritsu:#8c1d3c; --nanzan:#1f5c99; --pred:#9a5b00; --pred-soft:#fbefd9;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1b2029; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2c3340;
  --ai:#8fb0ea; --ai-ink:#12151c; --ai-soft:#22304a; --paper:#221f19; --paper-line:#3a352b;
  --ok:#6fcf9b; --ok-soft:#173326; --ng:#f2867c; --ng-soft:#3a1d1b; --scrim:rgba(0,0,0,.6);
  --doshi:#b896e0; --ritsu:#e88aa5; --nanzan:#86b6e8; --pred:#f0b860; --pred-soft:#3a2c14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b2029; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2c3340;
  --ai:#8fb0ea; --ai-ink:#12151c; --ai-soft:#22304a; --paper:#221f19; --paper-line:#3a352b;
  --ok:#6fcf9b; --ok-soft:#173326; --ng:#f2867c; --ng-soft:#3a1d1b; --scrim:rgba(0,0,0,.6);
  --doshi:#b896e0; --ritsu:#e88aa5; --nanzan:#86b6e8; --pred:#f0b860; --pred-soft:#3a2c14; color-scheme:dark}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;overflow:hidden}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.pad{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* 上部:タイトルと条件 */
.top{flex:none;display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.brand{font-family:var(--f-mincho);font-weight:700;font-size:1.05rem;letter-spacing:.04em;white-space:nowrap}
.cond{margin-left:auto;min-width:0;display:flex;align-items:center;gap:6px;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.82rem;padding:6px 10px;border-radius:999px;cursor:pointer}
.cond span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cond svg{flex:none}
.stats{flex:none;display:flex;gap:12px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-bottom:8px;white-space:nowrap;overflow:hidden}
.stats b{color:var(--ink)}

/* 中央:問題カード(この中だけスクロール) */
.main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.72rem}
.tag{padding:2px 8px;border-radius:4px;background:var(--ai-soft);color:var(--ai);font-weight:700}
.tag.u{color:#fff}
.tag.u.d{background:#5b2d8a}.tag.u.r{background:#8c1d3c}.tag.u.n{background:#1f5c99}
.lv{color:var(--muted);margin-left:auto;letter-spacing:.1em}
.shiryo{background:var(--paper);border:1px solid var(--paper-line);border-radius:6px;padding:12px 14px;font-family:var(--f-mincho);font-size:.98rem;line-height:1.9}
.shiryo cite{display:block;margin-top:4px;font-style:normal;font-size:.74rem;color:var(--muted);text-align:right;font-family:var(--f-body)}
.q{font-size:1.02rem;font-weight:500;margin:0}
.result{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.result.ok{background:var(--ok-soft)}.result.ng{background:var(--ng-soft)}
.verdict{display:flex;align-items:flex-end;gap:12px}
.mark{font-family:var(--f-mincho);font-size:1.9rem;font-weight:700;line-height:1}
.result.ok .mark{color:var(--ok)}.result.ng .mark{color:var(--ng)}
.ansblk{display:flex;flex-direction:column;min-width:0}
.yomi{font-size:.74rem;color:var(--muted);letter-spacing:.06em;line-height:1.3}
.correct{font-family:var(--f-mincho);font-size:1.2rem;font-weight:700;line-height:1.35}
.yours{font-size:.78rem;color:var(--muted)}
.exp{margin:0;font-size:.9rem}
.tag.pred{background:var(--pred-soft);color:var(--pred)}
.rel{border-top:1px dashed var(--line);padding-top:8px;font-size:.84rem}
.rel b{display:block;font-size:.72rem;letter-spacing:.1em;color:var(--ai);margin-bottom:2px}
.rel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.rel li{padding-left:.9em;text-indent:-.9em}
.rel li::before{content:'・';color:var(--muted)}
.rel strong{font-weight:700;margin-right:.4em}
.why{margin:4px 0 0;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.why b{display:block;font-size:.72rem;letter-spacing:.1em;color:var(--pred)}
.empty{color:var(--muted);text-align:center;padding:24px 0;margin:0}

/* 下部:解答バー(常に画面下) */
.bar{flex:none;background:var(--surface);border-top:1px solid var(--line);padding-block:10px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.btn{appearance:none;font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--ai);background:var(--ai);color:var(--ai-ink);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ai)}
.btn.wide{flex:1}
.btn.sm{padding:8px 12px;font-size:.85rem;font-weight:500}
.btn:focus-visible,.cond:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

/* 条件シート */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--surface);border-radius:16px 16px 0 0;max-height:85%;overflow-y:auto;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:1rem}
fieldset{border:0;margin:0;padding:0}
legend{font-size:.72rem;letter-spacing:.12em;color:var(--muted);margin-bottom:6px;font-weight:700;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.88rem;padding:7px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.note{font-size:.72rem;color:var(--muted);line-height:1.6;margin:0}
.danger{color:var(--ng);border-color:var(--ng)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>


<div class="app">
  <header class="top pad">
    <div class="brand">三大学 日本史ドリル</div>
    <button class="cond" type="button" id="openF" aria-haspopup="dialog"><span id="condLabel"></span><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
  </header>
  <div class="stats pad" id="stats"></div>
  <main class="main pad"><article class="card" id="card" aria-live="polite"></article></main>
  <div class="bar pad" id="bar"></div>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet pad" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <h2 id="sheetTitle">出題の条件</h2>
  <fieldset><legend>大学</legend><div class="chips" id="f-u"></div></fieldset>
  <fieldset><legend>時代</legend><div class="chips" id="f-e"></div></fieldset>
  <fieldset><legend>形式</legend><div class="chips" id="f-t"></div></fieldset>
  <button class="btn wide" type="button" id="closeF">この条件で出題</button>
  <p class="note">すべてこのアプリ用のオリジナル問題で、実際の入試問題ではありません。レベルは各大学の出題傾向(南山は大学公表の「出題の意図」)を参考にしています。漢字が違うと×になり、表記ゆれは「○にする」で直せます。成績はこの端末のブラウザに保存されます。</p>
  <button class="btn ghost sm danger" type="button" id="resetRec">成績をリセット</button>
</section>

<script>
// ===== 問題データ =====
// u: d=同志社 r=立命館 n=南山 / e: 時代 / t: k=一問一答 s=史料 / lv: 基本・標準・発展
const Q = [
// ---------- 南山(基本〜標準) ----------
{u:'n',e:'古代',t:'k',lv:'基本',q:'宮都の跡などから出土し、税の荷札や文書として使われた、墨で文字を書いた木の札を何というか。',a:'木簡',x:'藤原宮・平城宮跡などから大量に出土。藤原宮の木簡には「評」の表記があり、大宝令で「郡」に改められたことが確かめられた。地方行政や税(調・庸)の実態を知る重要史料。'},
{u:'n',e:'古代',t:'k',lv:'基本',q:'694年に持統天皇が遷った、日本で最初の本格的な都城を何というか。',a:'藤原京',x:'中国の都城制にならい、条坊制をもつ初の本格的都城。710年に元明天皇が平城京へ遷都するまで続いた。'},
{u:'n',e:'古代',t:'k',lv:'基本',q:'律令制で成年男子に課された、都での労役(歳役)の代わりに布などを納める税を何というか。',a:'庸',x:'租(稲)・調(特産物)・庸(布)の一つ。調と庸は農民自身が都まで運ぶ(運脚)必要があり、重い負担だった。'},
{u:'n',e:'古代',t:'k',lv:'基本',q:'603年に定められ、個人の才能や功績に応じて冠を与え、氏族単位の地位を改めようとした制度を何というか。',a:'冠位十二階',x:'厩戸王(聖徳太子)・蘇我馬子らの政治。翌604年の憲法十七条とともに、中央集権化と遣隋使外交の準備にあたる。'},
{u:'n',e:'古代',t:'k',lv:'標準',q:'663年、倭が百済復興を支援して、唐・新羅の連合軍に大敗した戦いを何というか。',a:'白村江の戦い',alt:['白村江'],x:'敗戦後、中大兄皇子は対馬・壱岐・筑紫に防人と烽を置き、大宰府の北に水城、西日本各地に朝鮮式山城を築いて防衛を固めた。'},
{u:'n',e:'古代',t:'k',lv:'標準',q:'5世紀ごろ渡来人が伝えた技術で作られた、ろくろを使い高温で焼いた灰色の硬い土器を何というか。',a:'須恵器',x:'それまでの赤褐色の土師器に対し、窖窯で高温焼成する。渡来人は鉄器・機織り・漢字なども伝えた。'},
{u:'n',e:'古代',t:'s',lv:'基本',s:'一に曰く、和を以て貴しと為し、忤ふること無きを宗とせよ。……二に曰く、篤く三宝を敬へ。三宝とは仏・法・僧なり。',src:'『日本書紀』',q:'この史料は604年に定められたとされる法の一部である。この法を何というか。',a:'憲法十七条',alt:['十七条憲法','十七条の憲法'],x:'豪族に官人としての心構えを説いたもの。仏教を重んじる姿勢(三宝)や、天皇への服従(詔を承りては必ず謹め)が示されている。'},
{u:'n',e:'中世',t:'k',lv:'基本',q:'1333年の鎌倉幕府滅亡後、後醍醐天皇が始めた天皇中心の政治を何というか。',a:'建武の新政',alt:['建武新政'],x:'天皇の綸旨を絶対としたため所領問題が混乱し、武士の不満が高まった。1335年の中先代の乱を機に足利尊氏が離反し、約3年で崩壊した。'},
{u:'n',e:'中世',t:'k',lv:'標準',q:'建武政権で、所領に関する訴訟を処理するために置かれた機関を何というか。',a:'雑訴決断所',x:'中央には記録所・雑訴決断所・恩賞方・武者所が置かれた。所領争いの急増に対応するため設けられた。'},
{u:'n',e:'中世',t:'k',lv:'標準',q:'「此比都ニハヤル物、夜討強盗謀綸旨」で始まり、建武政権下の混乱を風刺した落書を何というか。',a:'二条河原落書',x:'京都の二条河原に掲げられたとされ、『建武年間記』に収められる。偽の綸旨(謀綸旨)が出回る混乱ぶりを伝える。'},
{u:'n',e:'中世',t:'k',lv:'基本',q:'平清盛が修築し、日宋貿易の拠点とした摂津の港を何というか。',a:'大輪田泊',x:'現在の神戸港の一部。清盛は1180年に近くの福原へ遷都したが、反発が強く半年ほどで京都に戻った。'},
{u:'n',e:'中世',t:'k',lv:'標準',q:'1219年、鎌倉の鶴岡八幡宮で3代将軍源実朝を暗殺した人物は誰か。',a:'公暁',x:'公暁は2代将軍頼家の子。源氏の将軍が途絶えたことで、幕府は摂関家から藤原頼経を迎えた(摂家将軍)。'},
{u:'n',e:'近世',t:'k',lv:'標準',q:'1651年の慶安の変(由井正雪の乱)の後、牢人の増加を防ぐため幕府が緩めた禁令を何というか。',a:'末期養子の禁',alt:['末期養子の禁止'],x:'4代家綱のもとで緩和され、武断政治から文治政治への転換の象徴とされる。50歳未満の大名の末期養子が認められた。'},
{u:'n',e:'近世',t:'k',lv:'基本',q:'5代将軍徳川綱吉が出した、犬をはじめとする生き物の殺生を禁じた一連の法令を何というか。',a:'生類憐みの令',alt:['生類憐れみの令'],x:'1685年頃から出され、極端な運用で人々を苦しめた。一方で殺生や暴力を嫌う風潮を広める面もあった。綱吉の死後に廃止。'},
{u:'n',e:'近世',t:'k',lv:'標準',q:'1792年に根室へ来航し、漂流民大黒屋光太夫を送り届けて通商を求めたロシア使節は誰か。',a:'ラクスマン',x:'幕府は長崎入港の許可証(信牌)を渡して帰した。1804年にはその信牌を持ったレザノフが長崎に来航した。'},
{u:'n',e:'近世',t:'k',lv:'標準',q:'1808年に樺太を探査し、樺太が島であることを確認した人物は誰か。',a:'間宮林蔵',x:'樺太と大陸の間の海峡は間宮海峡と呼ばれる。同じ時期、近藤重蔵らが択捉島を探査した。'},
{u:'n',e:'近世',t:'k',lv:'標準',q:'河村瑞賢が整備した、日本海沿岸から下関を回って大坂へ至る航路を何というか。',a:'西廻り航路',alt:['西回り航路'],x:'東北から太平洋側を江戸へ向かう東廻り航路も瑞賢が整備した。のちに北前船が西廻り航路で活躍した。'},
{u:'n',e:'近世',t:'k',lv:'基本',q:'商工業者が結成し、田沼意次が営業の独占を認める代わりに運上・冥加を納めさせた同業組合を何というか。',a:'株仲間',x:'天保の改革で水野忠邦は物価高の原因として解散を命じたが、かえって流通が混乱し、1851年に再興が認められた。'},
{u:'n',e:'近代',t:'s',lv:'基本',s:'自今以後、一般ノ人民華士族卒農工商及婦女子必ス邑ニ不学ノ戸ナク、家ニ不学ノ人ナカラシメン事ヲ期ス。',src:'学事奨励に関する太政官布告(被仰出書)',q:'この方針のもと、1872年に公布された近代的学校制度を何というか。',a:'学制',x:'フランスの制度にならい全国を学区に分けた。授業料が自己負担だったため就学率は伸び悩み、1879年の教育令で改められた。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'1890年に発布され、忠君愛国を国民教育の基本とした文書を何というか。',a:'教育勅語',alt:['教育ニ関スル勅語','教育に関する勅語'],x:'元田永孚・井上毅らが起草。1891年には内村鑑三が勅語への拝礼をためらったとして職を追われた(内村鑑三不敬事件)。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'1872年に日本で最初に開業した鉄道は、どこからどこまでの区間か。',a:'新橋・横浜間',alt:['新橋横浜','新橋〜横浜','新橋-横浜','新橋から横浜','新橋横浜間'],x:'イギリスの技術と資金を導入。1874年には大阪・神戸間も開通した。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'足尾銅山鉱毒事件で被害を訴え続け、1901年に天皇への直訴を試みた元衆議院議員は誰か。',a:'田中正造',x:'渡良瀬川流域の農漁業に大きな被害が出た。政府は谷中村を廃村にして遊水池を設けた。日本の公害問題の原点とされる。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'吉野作造が唱えた、主権の所在は問わず、政治の目的を民衆の幸福におき政策決定に民衆の意向を重んじるという考えを何というか。',a:'民本主義',x:'美濃部達吉の天皇機関説とともに大正デモクラシーを支えた理論。吉野は黎明会を結成し、学生は東大新人会をつくった。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'1925年、加藤高明内閣のもとで成立し、満25歳以上の男性に選挙権を与えた法律を何というか。',a:'普通選挙法',x:'納税額による制限が撤廃され、有権者は約4倍に増えた。女性の参政権は1945年の選挙法改正で実現した。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'普通選挙法と同じ1925年に制定され、「国体」の変革や私有財産制度の否認を目的とする結社を取り締まった法律を何というか。',a:'治安維持法',x:'日ソ基本条約による国交樹立や普通選挙による社会主義勢力の伸長に備えたもの。1928年に最高刑が死刑に引き上げられた。'},
{u:'n',e:'現代',t:'k',lv:'基本',q:'寄生地主制を解体し、多くの自作農を生んだ占領期の改革を何というか。',a:'農地改革',x:'1946年からの第二次農地改革では、不在地主の全貸付地と、在村地主の一定面積(内地は平均1町歩)を超える貸付地を国が買い上げ、小作人に安く売り渡した。'},
{u:'n',e:'現代',t:'k',lv:'標準',q:'1949年のドッジ・ラインで設定された単一為替レートは、1ドル=何円か。',a:'360円',alt:['360'],x:'超均衡予算とあわせてインフレは収束したが、不況が深刻化した。1950年の朝鮮戦争による特需で景気は回復した。'},
{u:'n',e:'現代',t:'k',lv:'基本',q:'1951年、サンフランシスコ平和条約と同じ日に調印され、独立後も米軍の日本駐留を認めた条約を何というか。',a:'日米安全保障条約',alt:['日米安保条約','安保条約'],x:'吉田茂首相が調印。米軍の日本防衛義務が明記されないなど不平等な面があり、1960年に岸信介内閣が改定した。'},
{u:'n',e:'現代',t:'k',lv:'標準',q:'1989年12月、米ソ首脳が地中海の島で会談し、冷戦の終結を宣言した会談を何というか。',a:'マルタ会談',x:'ブッシュ(父)とゴルバチョフによる。1990年にドイツが統一し、1991年にソ連が解体した。'},
{u:'n',e:'現代',t:'k',lv:'標準',q:'1992年に成立し、自衛隊のカンボジア派遣の根拠となった法律を何というか。',a:'PKO協力法',alt:['国連平和維持活動協力法','PKO法'],x:'宮沢喜一内閣のもとで成立。湾岸戦争で資金協力しかしなかったことへの国際的批判がきっかけとなった。'},

// ---------- 立命館(記述中心・漢字の正確さ・やや難) ----------
{u:'r',e:'古代',t:'k',lv:'標準',q:'723年に出され、新たに灌漑施設をつくって開墾した土地は三代、既存の施設を使った場合は本人一代の私有を認めた法令を何というか。',a:'三世一身法',x:'口分田の不足を補うため長屋王政権が出した。期限が近づくと耕作が放棄されたため、743年に墾田永年私財法が出された。'},
{u:'r',e:'古代',t:'s',lv:'標準',s:'……今より以後は任に私財と為し、三世一身を論ずること無く、咸悉くに永年取る莫れ。',src:'『続日本紀』',q:'743年に出されたこの法令を何というか。',a:'墾田永年私財法',x:'聖武天皇のもとで出され、身分に応じて開墾できる面積に上限があった。貴族・寺社が開墾を進め、初期荘園が生まれるきっかけとなった。'},
{u:'r',e:'古代',t:'k',lv:'標準',q:'792年、桓武天皇が一部の地域を除き軍団を廃止した代わりに、郡司の子弟などから採用した兵を何というか。',a:'健児',x:'農民の兵役負担を軽くするための改革。東北や九州など辺境では軍団が残された。'},
{u:'r',e:'古代',t:'k',lv:'標準',q:'嵯峨天皇のときに置かれ、京都の治安維持や裁判を担った令外官を何というか。',a:'検非違使',x:'同じく嵯峨天皇が置いた令外官に、天皇の機密文書を扱う蔵人頭がある(初代は藤原冬嗣)。'},
{u:'r',e:'古代',t:'k',lv:'発展',q:'902年、醍醐天皇のもとで出された最初の荘園整理令を何というか。',a:'延喜の荘園整理令',alt:['延喜の荘園整理'],x:'同じ年には最後の班田が行われたとされる。律令制の立て直しをめざした「延喜・天暦の治」の一環。'},
{u:'r',e:'古代',t:'k',lv:'発展',q:'1069年、後三条天皇が荘園の証拠書類を審査するために設けた機関を何というか。',a:'記録荘園券契所',alt:['記録所'],x:'基準に合わない荘園は摂関家領でも停止させ、成果をあげた。後三条天皇は摂関家を外戚としない天皇だった。'},
{u:'r',e:'中世',t:'k',lv:'基本',q:'1232年、執権北条泰時が定めた、最初の武家法を何というか。',a:'御成敗式目',alt:['貞永式目'],x:'頼朝以来の先例と道理に基づく51か条。適用は幕府の勢力範囲に限られ、朝廷の公家法や荘園領主の本所法は別に存在した。'},
{u:'r',e:'中世',t:'k',lv:'標準',q:'鎌倉時代、地頭と荘園領主が荘園の土地そのものを分け合い、互いの支配に干渉しないことにした解決方法を何というか。',a:'下地中分',x:'このほか、地頭に荘園の管理を任せて一定の年貢納入を請け負わせる地頭請(所)もあった。'},
{u:'r',e:'中世',t:'k',lv:'発展',q:'1352年に初めて出され、守護に国内の荘園・公領の年貢の半分を兵粮米として徴収する権限を与えた法令を何というか。',a:'半済令',alt:['観応の半済令'],x:'最初は近江・美濃・尾張の3国に1年限りで認められたが、やがて全国に広がり永続化した。守護大名化を進める要因になった。'},
{u:'r',e:'中世',t:'s',lv:'発展',s:'正長元年ヨリサキ者、カンヘ四カンカウニヲヰメアルヘカラス',src:'柳生の徳政碑文',q:'この碑文は、ある一揆によって正長元年以前の負債が帳消しになったことを記したものである。この一揆を何というか。',a:'正長の徳政一揆',alt:['正長の土一揆','正長の一揆'],x:'1428年、近江坂本の馬借の蜂起から始まり、京都の土倉・酒屋などを襲った。神戸(かんべ)四箇郷に「負い目(借金)」はないという意味。'},
{u:'r',e:'中世',t:'k',lv:'標準',q:'1485年、南山城の国人らが両畠山氏の軍を国外に退去させ、8年間自治を行った一揆を何というか。',a:'山城の国一揆',alt:['山城国一揆'],x:'1488年には加賀の一向一揆が守護富樫政親を倒し、約100年にわたり門徒が加賀を支配した。'},
{u:'r',e:'中世',t:'k',lv:'標準',q:'応仁の乱で途絶えた後、京都の町衆によって1500年に再興された祭礼を何というか。',a:'祇園祭',x:'町衆は月行事を選んで町を自治的に運営した。京都の法華一揆も町衆の結束を示す。'},
{u:'r',e:'中世',t:'k',lv:'標準',q:'足利義政の東山山荘にある東求堂同仁斎に見られる、床の間・違い棚・付書院をもつ住宅様式を何というか。',a:'書院造',x:'現在の和風住宅の原型。同じ東山山荘の観音殿(銀閣)は、下層が書院造、上層が禅宗様の仏殿という構造。'},
{u:'r',e:'近世',t:'k',lv:'基本',q:'1588年、豊臣秀吉が一揆を防ぎ農民を耕作に専念させるため、百姓から武器を没収した法令を何というか。',a:'刀狩令',x:'没収した武器は方広寺の大仏造営に使うと説明された。1591年の人掃令とあわせて兵農分離が進んだ。'},
{u:'r',e:'近世',t:'k',lv:'基本',q:'1615年、2代将軍秀忠の名で出された大名統制の法令を何というか。',a:'武家諸法度',alt:['元和令'],x:'金地院崇伝が起草。城の新築禁止や修理の届出、大名同士の無許可の婚姻禁止などを定めた。1635年の寛永令で参勤交代が制度化された。'},
{u:'r',e:'近世',t:'k',lv:'標準',q:'享保の改革で、大名に石高1万石につき100石の米を上納させる代わりに、参勤交代の在府期間を半年に縮めた制度を何というか。',a:'上げ米',alt:['上米'],x:'8代将軍吉宗による財政再建策。幕府財政が立ち直った1730年に停止された。'},
{u:'r',e:'近世',t:'k',lv:'発展',q:'寛政の改革で、飢饉に備えて諸大名に1万石につき50石の米を蓄えさせた政策を何というか。',a:'囲米',x:'松平定信による。各地に社倉・義倉もつくらせた。江戸では七分積金で町入用の節約分を積み立てさせた。'},
{u:'r',e:'近世',t:'k',lv:'発展',q:'1843年、水野忠邦が江戸・大坂周辺の大名・旗本領を幕府の直轄地にしようとして失敗した法令を何というか。',a:'上知令',alt:['上地令'],x:'財政の安定と海防強化が目的だったが、大名・旗本の反対で撤回され、忠邦は老中を失脚した。'},
{u:'r',e:'近代',t:'k',lv:'基本',q:'1873年に始まり、課税の基準を収穫高から地価に改め、地価の3%を金納させた改革を何というか。',a:'地租改正',x:'政府の財政は安定したが、負担は江戸時代とほぼ変わらず各地で一揆が起きた。1877年に税率は2.5%に引き下げられた。'},
{u:'r',e:'近代',t:'s',lv:'発展',s:'臣等伏シテ方今政権ノ帰スル所ヲ察スルニ、上帝室ニ在ラス、下人民ニ在ラス、而独有司ニ帰ス。',src:'『日新真事誌』',q:'1874年、板垣退助らが左院に提出したこの文書を何というか。',a:'民撰議院設立の建白書',alt:['民選議院設立建白書','民撰議院設立建白書','民選議院設立の建白書'],x:'「有司」とは大久保利通ら一部の官僚。有司専制を批判し、国会の開設を求めた。自由民権運動の出発点となった。'},
{u:'r',e:'近代',t:'k',lv:'標準',q:'明治十四年の政変の際に出され、1890年の国会開設を約束した天皇の言葉を何というか。',a:'国会開設の勅諭',x:'開拓使官有物払下げ事件で政府批判が高まる中、大隈重信を罷免するとともに出された。'},
{u:'r',e:'近代',t:'k',lv:'標準',q:'1911年、小村寿太郎外相のもとで完全な回復が実現した、条約改正の課題は何か。',a:'関税自主権',x:'領事裁判権(治外法権)の撤廃は1894年、陸奥宗光外相のもとで日英通商航海条約により実現した。'},
{u:'r',e:'近代',t:'k',lv:'基本',q:'1918年、米騒動の後に立憲政友会総裁として本格的な政党内閣を組織した人物は誰か。',a:'原敬',x:'爵位をもたない衆議院議員だったため「平民宰相」と呼ばれた。1921年に東京駅で暗殺された。'},
{u:'r',e:'近代',t:'k',lv:'標準',q:'1938年、第1次近衛文麿内閣のもとで制定され、議会の承認なしに労働力や物資を戦争に動員できるようにした法律を何というか。',a:'国家総動員法',x:'翌1939年には、これに基づく勅令として国民徴用令が出された。'},
{u:'r',e:'現代',t:'k',lv:'標準',q:'1960年に成立した池田勇人内閣が掲げた経済政策を何というか。',a:'所得倍増計画',alt:['国民所得倍増計画'],x:'10年で国民所得を2倍にする目標は、実際には7年ほどで達成された。'},
{u:'r',e:'現代',t:'k',lv:'標準',q:'1972年、田中角栄首相が訪中し、中華人民共和国との国交を正常化した文書を何というか。',a:'日中共同声明',x:'これにより台湾(中華民国)とは国交が断絶した。1978年には福田赳夫内閣が日中平和友好条約を結んだ。'},
{u:'r',e:'中世',t:'k',lv:'基本',q:'東大寺南大門に安置され、運慶・快慶らが短期間で制作した一対の像を何というか。',a:'金剛力士像',x:'寄木造の技法で制作された。南大門そのものは、重源が宋の様式を取り入れた大仏様の建築。'},

{u:'d',e:'古代',t:'s',lv:'標準',s:'倭人は〔　〕の東南大海の中に在り、山島に依りて国邑を為す。旧百余国。',src:'『魏志』倭人伝',q:'空欄に入る、朝鮮半島に置かれた中国の郡の名を答えよ。',a:'帯方',alt:['帯方郡'],x:'帯方郡は3世紀初めに楽浪郡の南に置かれた。邪馬台国の卑弥呼は239年、帯方郡を通じて魏に使いを送った。'},
{u:'d',e:'古代',t:'k',lv:'標準',q:'239年に魏に使いを送った卑弥呼が、魏の皇帝から授けられた称号を何というか。',a:'親魏倭王',x:'金印紫綬と銅鏡100枚などを与えられたと記される。'},
{u:'d',e:'古代',t:'s',lv:'発展',s:'其の一に曰く、昔在の天皇等の立てたまへる子代の民、処々の屯倉、及び別には臣・連・伴造・国造・村首の所有る部曲の民、処々の田荘を罷めよ。',src:'『日本書紀』',q:'646年に出されたとされるこの詔を何というか。',a:'改新の詔',x:'王族や豪族の私有地・私有民を廃止する公地公民の方針を示した。詔の文章には後の大宝令による修飾があると考えられている(郡評論争)。'},
{u:'d',e:'古代',t:'k',lv:'標準',q:'刑部親王とともに大宝律令の編纂の中心となった人物は誰か。',a:'藤原不比等',x:'中臣鎌足の子。のちに養老律令の編纂も主導した。娘の宮子は文武天皇に、光明子は聖武天皇に嫁いだ。'},
{u:'d',e:'古代',t:'k',lv:'標準',q:'740年、玄昉や吉備真備の排除を求めて九州で反乱を起こした人物は誰か。',a:'藤原広嗣',x:'大宰少弐として大宰府で挙兵したが鎮圧された。乱の後、聖武天皇は恭仁京・難波宮・紫香楽宮と都を移した。'},
{u:'d',e:'古代',t:'k',lv:'標準',q:'866年、応天門の放火の罪を問われて流罪となった大納言は誰か。',a:'伴善男',x:'この事件を機に藤原良房が正式に摂政となった。事件は絵巻物『伴大納言絵巻』に描かれている。'},
{u:'d',e:'古代',t:'k',lv:'発展',q:'969年の安和の変で、大宰府に左遷された左大臣は誰か。',a:'源高明',x:'この事件で藤原氏の他氏排斥は完了し、以後ほぼ常に摂政・関白が置かれるようになった。'},
{u:'d',e:'古代',t:'k',lv:'発展',q:'1019年、沿海州方面の女真族が対馬・壱岐・九州北部を襲った事件を何というか。',a:'刀伊の入寇',x:'大宰権帥の藤原隆家が九州の武士を率いて撃退した。地方武士の実力を示した事件でもある。'},
{u:'d',e:'古代',t:'k',lv:'標準',q:'白河上皇が院の御所の警護のために組織した武士を何というか。',a:'北面の武士',x:'院政の軍事力となり、平正盛・忠盛らの伊勢平氏が院と結びついて台頭するきっかけになった。'},
{u:'d',e:'中世',t:'s',lv:'標準',s:'皆心を一にして奉るべし。是れ最期の詞なり。故右大将軍朝敵を征罰し、関東を草創してより以降、官位と云ひ俸禄と云ひ、其の恩既に山岳よりも高く、溟渤よりも深し。',src:'『吾妻鏡』',q:'承久の乱に際して御家人に結束を訴えた、この言葉の主は誰か。',a:'北条政子',x:'「故右大将軍」は源頼朝。乱後、幕府は京都に六波羅探題を置き、上皇方の所領に新補地頭を任命した。'},
{u:'d',e:'中世',t:'k',lv:'基本',q:'承久の乱の後、朝廷の監視と西国御家人の統轄のため京都に置かれた機関を何というか。',a:'六波羅探題',x:'北条泰時と時房が最初の探題となった。それまで京都に置かれていた京都守護に代わるもの。'},
{u:'d',e:'中世',t:'s',lv:'発展',s:'一、質券売買地の事……右、地領を以て或いは質券に入れ流し、或いは売買せしむるの条、御家人等侘傺の基なり。向後に於いては停止に従ふべし。以前沽却の分に至りては、本主之を取り返すべし。',src:'『東寺百合文書』',q:'1297年に出されたこの法令を何というか。',a:'永仁の徳政令',x:'困窮した御家人を救うため、所領の質入れ・売買を禁じ、売却済みの所領も元の持ち主が取り戻せるとした。かえって御家人は金融の道を断たれ、効果は一時的だった。'},
{u:'d',e:'中世',t:'k',lv:'標準',q:'『立正安国論』を著して前執権の北条時頼に提出し、法華経の信仰を説いた僧は誰か。',a:'日蓮',x:'他宗を激しく批判したため伊豆・佐渡に流された。開いた宗派は法華宗(日蓮宗)。'},
{u:'d',e:'中世',t:'k',lv:'基本',q:'1404年に始まった日明貿易で、倭寇と区別するために使われた証票を何というか。',a:'勘合',x:'足利義満が明の皇帝から「日本国王」として冊封を受けた朝貢形式の貿易。のちに細川氏と大内氏が貿易の主導権を争った(寧波の乱、1523年)。'},
{u:'d',e:'中世',t:'k',lv:'発展',q:'1510年、朝鮮の三つの港に住む日本人が起こした暴動を何というか。',a:'三浦の乱',x:'三浦は富山浦・乃而浦・塩浦。これ以降、日朝貿易は衰退した。'},
{u:'d',e:'中世',t:'k',lv:'標準',q:'戦国時代、堺の自治を担った豪商たちの組織を何というか。',a:'会合衆',x:'36人の会合衆が市政を運営した。博多では年行司と呼ばれる豪商が自治を行った。'},
{u:'d',e:'近世',t:'k',lv:'標準',q:'1637年に始まった島原・天草一揆で、一揆勢の首領とされた少年は誰か。',a:'益田時貞',alt:['天草四郎','天草四郎時貞','益田四郎時貞'],x:'原城に立てこもったが、翌年老中松平信綱の率いる幕府軍に鎮圧された。この後、幕府はポルトガル船の来航を禁止した(1639年)。'},

{u:'d',e:'近世',t:'k',lv:'発展',q:'1863年、会津藩・薩摩藩などが長州藩勢力と三条実美ら急進派の公家を京都から追放した政変を何というか。',a:'八月十八日の政変',x:'翌1864年、長州藩は勢力回復をめざして京都に攻め上ったが敗れた(禁門の変・蛤御門の変)。'},
{u:'d',e:'近代',t:'s',lv:'基本',s:'第一条　大日本帝国ハ万世一系ノ天皇之ヲ統治ス\n第三条　天皇ハ神聖ニシテ侵スヘカラス',src:'',q:'1889年2月11日に発布された、この条文をもつ憲法を何というか。',a:'大日本帝国憲法',alt:['明治憲法'],x:'天皇が定めて国民に与える欽定憲法。統帥権など議会が関与できない広い天皇大権が定められた。'},

{u:'n',e:'近世',t:'k',lv:'標準',q:'加賀藩に仕えたのち5代将軍綱吉の侍講となり、新井白石や室鳩巣を育てた朱子学者は誰か。',a:'木下順庵',x:'京学の松永尺五に学んだ。門下の新井白石は6代家宣に登用され、正徳の政治を主導した。'},
{u:'n',e:'近世',t:'s',lv:'標準',s:'一　文武忠孝を励し、礼儀を正すべきの事。',src:'武家諸法度(天和令)',q:'1683年、武家諸法度の第一条をこのように改めた将軍は誰か。',a:'徳川綱吉',x:'それまでの第一条「文武弓馬の道、専ら相嗜むべき事」から、主君への忠と親への孝、礼儀を重んじる内容に変わった。武断政治から文治政治への転換を示す条文。'},
{u:'n',e:'近世',t:'k',lv:'標準',q:'17世紀後半に多く見られた、村の代表者が百姓全体の要求を領主や幕府に直訴する形の一揆を何というか。',a:'代表越訴型一揆',x:'下総の佐倉惣五郎が代表例として伝えられる。18世紀になると、村全体の百姓が参加する惣百姓一揆が広がった。'},
{u:'n',e:'近世',t:'k',lv:'基本',q:'1862年、島津久光の行列を横切ったイギリス人を薩摩藩士が殺傷した事件を何というか。',a:'生麦事件',x:'翌1863年、イギリス艦隊が鹿児島を攻撃した(薩英戦争)。これを機に薩摩藩は攘夷が不可能だと悟り、イギリスに接近した。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'1872年に群馬県で操業を始めた、フランスの技術を導入した官営模範工場を何というか。',a:'富岡製糸場',x:'殖産興業政策の代表例。全国から集まった工女が技術を学び、各地に広めた。2014年に世界遺産に登録された。'},
{u:'n',e:'近代',t:'k',lv:'標準',q:'関東大震災で決済できなくなり、日本銀行が特別融資で処理した手形を何というか。',a:'震災手形',x:'その処理をめぐる議会審議中の片岡直温蔵相の失言から、1927年に金融恐慌が起きた。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'1940年、新体制運動の中で政党が解散して合流し、結成された組織を何というか。',a:'大政翼賛会',x:'第2次近衛文麿内閣のもとで結成され、総裁は首相が務めた。部落会・町内会・隣組が下部組織となった。'},
{u:'n',e:'現代',t:'k',lv:'基本',q:'1945年10月、マッカーサーが幣原喜重郎首相に口頭で指示した5つの民主化の改革を何というか。',a:'五大改革指令',alt:['五大改革'],x:'女性の解放(参政権)、労働組合の結成奨励、教育の自由主義化、圧政的諸制度の撤廃、経済機構の民主化の5つ。'},
{u:'n',e:'現代',t:'s',lv:'基本',s:'日本国民は、正義と秩序を基調とする国際平和を誠実に希求し、国権の発動たる戦争と、武力による威嚇又は武力の行使は、国際紛争を解決する手段としては、永久にこれを放棄する。',src:'',q:'この条文をもつ法は何か。',a:'日本国憲法',x:'第9条第1項。1946年11月3日に公布、1947年5月3日に施行された。国民主権・基本的人権の尊重・平和主義を三原則とする。'},
{u:'n',e:'現代',t:'k',lv:'標準',q:'高度経済成長期の公害の深刻化を受け、1967年に制定された公害対策の基本となる法律を何というか。',a:'公害対策基本法',x:'1971年には環境庁が発足した。水俣病・新潟水俣病・イタイイタイ病・四日市ぜんそくの四大公害訴訟は、いずれも被害者側が勝訴した。'},
{u:'n',e:'現代',t:'k',lv:'基本',q:'1973年、第4次中東戦争をきっかけに原油価格が急騰し、日本経済が混乱した出来事を何というか。',a:'第1次石油危機',alt:['石油危機','オイルショック','第一次石油危機','第1次オイルショック'],x:'狂乱物価と呼ばれるインフレが起き、1974年には戦後初のマイナス成長となった。高度経済成長はここで終わった。'},

{u:'r',e:'近世',t:'k',lv:'標準',q:'1643年、本百姓の没落を防ぐため、田畑の売買を禁じた法令を何というか。',a:'田畑永代売買の禁止令',alt:['田畑永代売買禁止令','田畑永代売買の禁令','田畑永代売買の禁'],x:'寛永の飢饉の後に出された。1673年の分地制限令とあわせ、年貢を負担する本百姓の経営を守るねらいがあった。'},

{u:'r',e:'近世',t:'k',lv:'標準',q:'田沼意次が新田開発のため干拓を進めたが、利根川の洪水で中止された下総の沼を何というか。',a:'印旛沼',x:'田沼は手賀沼の干拓も進めた。印旛沼の工事は天保の改革で水野忠邦も試みたが、失敗した。'},
{u:'r',e:'近世',t:'k',lv:'発展',q:'寛政の改革で、困窮した旗本・御家人を救うため、札差からの借金を帳消しにさせた法令を何というか。',a:'棄捐令',x:'6年以上前の借金は帳消し、それ以降の分は低利で年賦返済とした。札差は以後の貸し渋りで対抗した。'},
{u:'r',e:'近世',t:'s',lv:'標準',s:'朱学の儀は、慶長以来御代々御信用の御事にて、已に其方家代々右学風維持の事仰付置かれ候儀に候得共……此度聖堂御取締厳重に仰付けられ……',src:'『徳川禁令考』',q:'1790年、松平定信が林家に対して出したこの命令を何というか。',a:'寛政異学の禁',x:'朱子学を正学とし、聖堂学問所で他の学派の講義を禁じた。のちに聖堂学問所は幕府直轄の昌平坂学問所となった。'},
{u:'r',e:'近世',t:'k',lv:'基本',q:'1854年、ペリーとの間で結ばれ、下田・箱館の2港を開いた条約を何というか。',a:'日米和親条約',alt:['神奈川条約'],x:'アメリカ船への燃料・食料の供給や、一方的な最恵国待遇を認めた。貿易の規定はまだなかった。'},
{u:'r',e:'近代',t:'k',lv:'基本',q:'1869年、藩主が領地と領民を天皇に返上したことを何というか。',a:'版籍奉還',x:'旧藩主はそのまま知藩事に任命されたため、実態はあまり変わらなかった。1871年の廃藩置県で中央集権体制が整った。'},
{u:'r',e:'近代',t:'k',lv:'基本',q:'1873年に出された、満20歳以上の男子に兵役を課した法令を何というか。',a:'徴兵令',x:'大村益次郎が構想し、山県有朋が実現した。戸主や長男などには免除規定があり、各地で血税一揆が起きた。'},
{u:'r',e:'近代',t:'k',lv:'標準',q:'1880年、愛国社を中心に結成され、国会開設の請願書を提出した組織を何というか。',a:'国会期成同盟',x:'政府は請願を受け付けず、同年に集会条例を出して運動を取り締まった。'},
{u:'r',e:'近代',t:'k',lv:'発展',q:'1887年、三大事件建白運動の高まりに対し、民権派を東京から追放した法令を何というか。',a:'保安条例',x:'三大事件とは、地租の軽減・言論集会の自由・外交失策の挽回(条約改正問題)の3つの要求。尾崎行雄・中江兆民らが追放された。'},
{u:'r',e:'近代',t:'k',lv:'発展',q:'1897年、高野房太郎・片山潜らが結成し、労働組合の結成を促した団体を何というか。',a:'労働組合期成会',x:'この運動に対し、政府は1900年に治安警察法を制定して労働運動を取り締まった。'},
{u:'r',e:'近代',t:'k',lv:'標準',q:'1910年、天皇暗殺を計画したとして多くの社会主義者・無政府主義者が検挙され、幸徳秋水らが処刑された事件を何というか。',a:'大逆事件',x:'この後、社会主義運動は「冬の時代」に入った。同じ年に韓国併合が行われている。'},
{u:'r',e:'近代',t:'k',lv:'標準',q:'1927年、片岡直温蔵相の失言をきっかけに銀行への取り付け騒ぎが広がった出来事を何というか。',a:'金融恐慌',x:'若槻礼次郎内閣は台湾銀行救済の緊急勅令を枢密院に否決されて総辞職した。次の田中義一内閣がモラトリアム(支払猶予令)で収めた。'},
{u:'r',e:'近代',t:'k',lv:'標準',q:'1930年、浜口雄幸内閣の井上準之助蔵相が実施した、金の輸出を再び自由にした政策を何というか。',a:'金解禁',alt:['金輸出解禁'],x:'旧平価(実勢より円高)で行ったうえ、世界恐慌と重なったため昭和恐慌を招いた。1931年、犬養毅内閣の高橋是清蔵相が金輸出を再禁止した。'},
{u:'r',e:'近代',t:'k',lv:'発展',q:'1935年、天皇機関説が攻撃されたことを受け、岡田啓介内閣が出した声明を何というか。',a:'国体明徴声明',x:'天皇機関説を否定する声明で、美濃部達吉の著書は発禁となり、美濃部は貴族院議員を辞職した。'},
{u:'r',e:'近代',t:'s',lv:'標準',s:'第一款　朝鮮国ハ自主ノ邦ニシテ日本国ト平等ノ権ヲ保有セリ',src:'',q:'1876年、江華島事件を機に日本が朝鮮と結んだこの条約を何というか。',a:'日朝修好条規',alt:['江華条約'],x:'朝鮮を「自主の邦」とするのは清の宗主権を否定するねらい。釜山など3港の開港や日本の領事裁判権を認めさせた不平等条約だった。'},
{u:'r',e:'現代',t:'k',lv:'標準',q:'1947年に制定され、教育の機会均等や9年間の義務教育を定めた法律を何というか。',a:'教育基本法',x:'同時に学校教育法が制定され、六・三・三・四制が始まった。2006年に全面改正された。'},

{u:'d',e:'近世',t:'k',lv:'標準',q:'1604年に始まった、特定の商人仲間に輸入生糸を一括購入させ、ポルトガル商人の利益独占を排除した制度を何というか。',a:'糸割符制度',x:'京都・堺・長崎の商人で始まり、のちに江戸・大坂が加わって五カ所商人となった。'},
{u:'d',e:'近世',t:'k',lv:'標準',q:'1613年、伊達政宗が支倉常長をスペインに派遣した使節を何というか。',a:'慶長遣欧使節',x:'メキシコとの直接貿易をめざしたが、目的は果たせなかった。帰国した1620年にはキリスト教の禁止が強まっていた。'},
{u:'d',e:'近世',t:'s',lv:'標準',s:'一　自今以後、かれうた渡海の儀、之を停止せられ畢。此上若し差渡るニおゐてハ、其船を破却し、并乗来る者速に斬罪に処せらるべき旨、仰せ出さるる所也。',src:'『御当家令条』',q:'1639年のこの法令で来航が禁止された「かれうた」は、どこの国の船か。',a:'ポルトガル',alt:['ポルトガル船'],x:'島原・天草一揆の後に出された。1641年にはオランダ商館が平戸から長崎の出島に移され、いわゆる鎖国体制が完成した。'},
{u:'d',e:'近世',t:'k',lv:'基本',q:'1641年、平戸からオランダ商館が移された長崎の人工島を何というか。',a:'出島',x:'もとはポルトガル人を収容するために築かれた。オランダ商館長はオランダ風説書を幕府に提出し、海外情報を伝えた。'},
{u:'d',e:'近世',t:'k',lv:'標準',q:'1720年、キリスト教に関係のない漢訳洋書の輸入制限を緩めた将軍は誰か。',a:'徳川吉宗',x:'青木昆陽・野呂元丈にオランダ語を学ばせ、蘭学の発展のきっかけとなった。'},
{u:'d',e:'近世',t:'k',lv:'基本',q:'前野良沢・杉田玄白らがオランダ語の解剖書を翻訳し、1774年に刊行した書物を何というか。',a:'解体新書',x:'原書はドイツ人の書いた解剖書のオランダ語訳『ターヘル・アナトミア』。翻訳の苦労は杉田玄白の『蘭学事始』に記されている。'},
{u:'d',e:'近世',t:'k',lv:'発展',q:'モリソン号事件での幕府の対応を『戊戌夢物語』で批判し、蛮社の獄で処罰された蘭学者は誰か。',a:'高野長英',x:'同じく『慎機論』を著した渡辺崋山も処罰された。二人は尚歯会(蛮社)の中心人物だった。'},
{u:'d',e:'近世',t:'k',lv:'標準',q:'1867年、将軍徳川慶喜に大政奉還を建白した前土佐藩主は誰か。',a:'山内豊信',alt:['山内容堂'],x:'後藤象二郎・坂本龍馬らの案を受けたもの。これに対し倒幕派は王政復古の大号令と小御所会議で慶喜の辞官納地を決めた。'},
{u:'d',e:'近代',t:'k',lv:'標準',q:'1871年に出発した岩倉使節団に同行してアメリカに渡り、のちに女子英学塾を創設した女性は誰か。',a:'津田梅子',x:'同行した女子留学生の中で最年少(当時満6歳)。使節団は条約改正の予備交渉には失敗し、欧米の制度視察が主な成果となった。'},
{u:'d',e:'近代',t:'k',lv:'標準',q:'1875年、ロシアとの間で樺太をロシア領、千島全島を日本領と定めた条約を何というか。',a:'樺太・千島交換条約',alt:['樺太千島交換条約'],x:'1854年の日露和親条約では、択捉島以南を日本領、得撫島以北をロシア領とし、樺太は両国の雑居地としていた。'},
{u:'d',e:'近代',t:'k',lv:'基本',q:'1902年、第1次桂太郎内閣がロシアの南下に対抗してイギリスと結んだ同盟を何というか。',a:'日英同盟',alt:['日英同盟協約'],x:'1921年のワシントン会議で結ばれた四カ国条約により、1923年に廃棄された。'},
{u:'d',e:'近代',t:'s',lv:'標準',s:'第二条　露西亜帝国政府ハ、日本国カ韓国ニ於テ政事上、軍事上及経済上ノ卓絶ナル利益ヲ有スルコトヲ承認シ……',src:'',q:'1905年に結ばれたこの条約を何というか。',a:'ポーツマス条約',alt:['日露講和条約'],x:'ほかに旅順・大連の租借権、長春以南の鉄道の権利、北緯50度以南の樺太の譲渡、沿海州などの漁業権を認めさせた。'},
{u:'d',e:'近代',t:'k',lv:'標準',q:'1910年の韓国併合で設置された、朝鮮統治のための機関を何というか。',a:'朝鮮総督府',x:'初代総督は寺内正毅。土地調査事業を進め、多くの土地が接収された。'},
{u:'d',e:'近代',t:'k',lv:'標準',q:'ワシントン会議で結ばれ、太平洋の島々の現状維持を約束するとともに日英同盟の廃棄を決めた条約を何というか。',a:'四カ国条約',alt:['四か国条約','4カ国条約','四箇国条約'],x:'日・英・米・仏の4か国。同会議では中国の主権尊重を定めた九カ国条約、主力艦の保有を制限した海軍軍縮条約も結ばれた。'},
{u:'d',e:'近代',t:'k',lv:'標準',q:'1933年、国際連盟の総会で満洲国を認めない勧告案が採択された際、議場を退場した日本の首席全権は誰か。',a:'松岡洋右',x:'勧告案はリットン調査団の報告に基づくもの。日本は同年に国際連盟脱退を通告した。'},
{u:'d',e:'近代',t:'s',lv:'標準',s:'第一条　国体ヲ変革シ又ハ私有財産制度ヲ否認スルコトヲ目的トシテ結社ヲ組織シ又ハ情ヲ知リテ之ニ加入シタル者ハ十年以下ノ懲役又ハ禁錮ニ処ス',src:'',q:'1925年に制定されたこの法律を何というか。',a:'治安維持法',x:'1928年の改正で最高刑が死刑となった。同年の三・一五事件、翌年の四・一六事件で共産党員が大量に検挙された。'},
{u:'d',e:'近代',t:'k',lv:'基本',q:'1940年、第2次近衛文麿内閣のもとで日本・ドイツ・イタリアが結んだ同盟を何というか。',a:'日独伊三国同盟',alt:['三国同盟'],x:'同じ年に北部仏印進駐が行われ、アメリカとの対立が深まった。1941年には日ソ中立条約が結ばれた。'},
{u:'d',e:'現代',t:'s',lv:'基本',s:'吾等ハ日本国政府カ直ニ全日本国軍隊ノ無条件降伏ヲ宣言シ、且右行動ニ於ケル同政府ノ誠意ニ付適当且充分ナル保障ヲ提供センコトヲ同政府ニ対シ要求ス。',src:'',q:'1945年7月、日本に降伏を求めたこの文書を何というか。',a:'ポツダム宣言',x:'米・英・中の名で発表され、のちにソ連も加わった。日本は8月14日に受諾を決定し、15日に天皇のラジオ放送で国民に伝えられた。'},
{u:'d',e:'現代',t:'k',lv:'基本',q:'1960年、岸信介内閣による日米安全保障条約の改定に反対して起きた大規模な運動を何というか。',a:'安保闘争',alt:['60年安保闘争','六〇年安保闘争'],x:'新安保条約は衆議院で強行採決され、参議院の議決を経ないまま自然成立した。岸内閣は条約発効後に総辞職した。'},
{u:'d',e:'現代',t:'k',lv:'標準',q:'1965年、佐藤栄作内閣が韓国と結び、国交を正常化した条約を何というか。',a:'日韓基本条約',x:'韓国を朝鮮半島にある唯一の合法的な政府と認めた。'},
{u:'d',e:'現代',t:'k',lv:'標準',q:'1971年、アメリカのニクソン大統領が金とドルの交換停止などを発表したことによる衝撃を何というか。',a:'ニクソン・ショック',alt:['ドル・ショック','ニクソンショック','ドルショック'],x:'同年末のスミソニアン協定で1ドル=308円に切り上げられ、1973年に変動相場制へ移行した。'},

// ===== 予想問題(p:1、g=出題予想の根拠) =====
// ---------- 同志社 ----------
{p:1,u:'d',e:'古代',t:'k',lv:'発展',g:'〔1〕は毎年古代。政治・外交の年が多く(2021・2024)、遣隋使・遣唐使まわりは人名まで問われやすい。',q:'608年、小野妹子に従って隋に渡り、帰国後に高向玄理とともに国博士となった僧は誰か。',a:'旻',alt:['僧旻'],x:'同行した留学生・学問僧には高向玄理・南淵請安もいた。彼らが持ち帰った知識は大化の改新の政治に生かされた。'},
{p:1,u:'d',e:'古代',t:'k',lv:'標準',g:'〔1〕古代の外交は頻出テーマ。遣唐使の始まりは人名記述で狙われやすい。',q:'630年、最初の遣唐使として派遣された人物は誰か。',a:'犬上御田鍬',x:'犬上御田鍬は614年に遣隋使も務めた。遣唐使は894年に菅原道真の建議で停止されるまで続いた。'},
{p:1,u:'d',e:'古代',t:'s',lv:'標準',g:'同志社は〔1〕に史料を付けることがある(2021年度)。古代外交の定番史料。',s:'日出づる処の天子、書を日没する処の天子に致す。恙無きや、云々。帝、之を覧て悦ばず……',src:'',q:'607年の遣隋使派遣を伝えるこの記事が載っている中国の歴史書は何か。',a:'隋書',alt:['『隋書』倭国伝','隋書倭国伝','隋書倭国伝'],x:'「帝」は隋の煬帝。対等な立場を示そうとした国書に不快感を示したが、高句麗との戦いを控えていたため翌年裴世清を倭に派遣した。'},
{p:1,u:'d',e:'古代',t:'k',lv:'標準',g:'2020年度に「古代の皇位継承の争い」、2022年度に「奈良の人物」が出ており、奈良時代の政変は再出題の可能性が高い。',q:'729年、藤原四子の策謀により謀反の疑いをかけられ、自害に追い込まれた左大臣は誰か。',a:'長屋王',x:'長屋王の変。この後、藤原光明子が皇族以外で初めて皇后となった。藤原四子は737年に天然痘で相次いで死去した。'},
{p:1,u:'d',e:'中世',t:'k',lv:'標準',g:'〔2〕は奇数年度に中世の社会経済・対外関係(2021・2023・2025)。鎌倉の商業は社会経済の定番。',q:'鎌倉時代、荘園の中心地や交通の要地で月に3回開かれた定期市を何というか。',a:'三斎市',x:'室町時代には月6回の六斎市が一般化した。売買には宋銭が使われ、年貢の銭納(代銭納)も広がった。'},
{p:1,u:'d',e:'中世',t:'k',lv:'標準',g:'〔2〕中世社会経済の頻出用語。',q:'鎌倉時代、港や河川の要地で年貢などの保管・輸送・委託販売を行った業者を何というか。',a:'問丸',x:'室町時代には卸売商人の問屋へと発展した。遠隔地への送金には為替が使われた。'},
{p:1,u:'d',e:'中世',t:'k',lv:'標準',g:'〔2〕中世社会経済。室町幕府の財源は選択・記述の両方で出やすい。',q:'室町幕府が金融業者に課した税を、業者の種類にちなんで何というか。',a:'土倉役・酒屋役',alt:['土倉役酒屋役','倉役・酒屋役','土倉酒屋役'],x:'幕府はほかに、関銭・津料、守護に課した守護出銭、日明貿易の抽分銭などを財源とした。'},
{p:1,u:'d',e:'中世',t:'k',lv:'発展',g:'2023年度に「古代〜中世の日朝関係」。奇数年度の〔2〕で対外関係が出るなら、日朝関係の細部が狙われる。',q:'1419年、朝鮮が倭寇の根拠地とみなして対馬を攻撃した事件を何というか。',a:'応永の外寇',x:'一時的に日朝貿易は中断したが、まもなく再開した。日朝貿易は対馬の宗氏が統制した。'},
{p:1,u:'d',e:'中世',t:'k',lv:'標準',g:'中世の対外関係では琉球もセットで問われやすい。',q:'1429年、三山を統一して琉球王国を建てた人物は誰か。',a:'尚巴志',x:'都は首里。琉球は明に朝貢し、東アジアと東南アジアを結ぶ中継貿易で栄えた。'},
{p:1,u:'d',e:'近世',t:'k',lv:'基本',g:'〔3〕は6年中5年が社会経済。江戸の流通は毎年のように問われる。',q:'江戸時代、諸藩が年貢米や特産物を販売するために大坂などに置いた倉庫兼取引所を何というか。',a:'蔵屋敷',x:'蔵屋敷に運ばれた米や特産物を蔵物という。これに対し、商人が扱う一般の商品は納屋物と呼ばれた。'},
{p:1,u:'d',e:'近世',t:'k',lv:'標準',g:'2021年度「江戸時代の諸産業の発達」、2024年度「近代の産業経済」。生産形態の変化は〔3〕の軸になりやすい。',q:'19世紀、地主や問屋が工場に労働者を集め、分業と協業で生産した形態を何というか。',a:'工場制手工業',alt:['マニュファクチュア'],x:'大坂周辺や尾張の綿織物業、北関東の絹織物業などで見られた。それ以前は問屋が原料や道具を貸し与える問屋制家内工業が広がっていた。'},
{p:1,u:'d',e:'近代',t:'k',lv:'標準',g:'2024年度にグラフ・計算問題付きで「近代の貿易と産業経済」。財政政策は数値の読み取りと結びつけやすい。',q:'1880年代前半、大蔵卿松方正義が紙幣整理と増税で進めたデフレーション政策を何というか。',a:'松方財政',alt:['松方デフレ'],x:'1882年に日本銀行を設立し、銀兌換の日本銀行券を発行した。米や繭の価格が暴落して農民が困窮し、秩父事件などの激化事件の背景となった。'},
{p:1,u:'d',e:'近代',t:'k',lv:'標準',g:'2025年度「江戸〜明治の民衆の抵抗運動」。自由民権運動の激化事件は再出題の可能性がある。',q:'1884年、困民党を名のる農民が負債の減免などを求めて蜂起し、軍隊に鎮圧された事件を何というか。',a:'秩父事件',x:'松方デフレによる生糸価格の暴落が背景。同じ年には加波山事件も起き、自由党は解党した。'},
{p:1,u:'d',e:'近代',t:'k',lv:'標準',g:'近代の経済史で必ず押さえる制度。〔3〕の社会経済と相性がよい。',q:'1897年の貨幣法で確立した通貨制度を何というか。',a:'金本位制',x:'日清戦争の賠償金を準備金にした。1917年に金輸出を禁止し、1930年の金解禁で一時復帰した後、1931年に再び停止した。'},
{p:1,u:'d',e:'近代',t:'s',lv:'標準',g:'同志社〔3〕は社会経済に史料を付ける傾向(2020・2022・2023年度)。労働関係の法令は定番。',s:'第一条　本法ハ左ノ各号ノ一ニ該当スル工場ニ之ヲ適用ス\n一　常時十五人以上ノ職工ヲ使用スルモノ',src:'',q:'1911年に公布され、1916年に施行されたこの法律を何というか。',a:'工場法',x:'日本初の労働者保護法で、少年・女性の就業時間の制限や深夜業の禁止を定めた。ただし適用は15人以上の工場に限られ、資本家の反対で施行も5年遅れた。'},
{p:1,u:'d',e:'近代',t:'k',lv:'標準',g:'2022年度に「大正〜昭和初期の恐慌」。恐慌の順番(戦後→震災→金融→昭和)は配列問題にもなる。',q:'第一次世界大戦後の1920年、株価の暴落から始まった恐慌を何というか。',a:'戦後恐慌',x:'大戦景気の反動で起きた。その後、1923年の震災恐慌、1927年の金融恐慌、1930年の昭和恐慌と続いた。'},
{p:1,u:'d',e:'現代',t:'k',lv:'標準',g:'2020・2021年度は〔3〕が昭和戦後まで及んだ。戦後の経済は出題範囲の下限として要注意。',q:'1955年から1957年まで続き、「もはや戦後ではない」と言われるきっかけとなった好景気を何というか。',a:'神武景気',x:'この後、岩戸景気(1958〜61年)、オリンピック景気、いざなぎ景気(1966〜70年)と続いた。'},

// ---------- 立命館 ----------
{p:1,u:'r',e:'古代',t:'k',lv:'基本',g:'〔1〕は3年連続で仏教・信仰(2023〜2025年度)。奈良仏教の基本人物。',q:'何度も渡航に失敗しながら来日し、東大寺に戒壇を設けたのち唐招提寺を開いた唐の僧は誰か。',a:'鑑真',x:'正式な僧になるための受戒の制度を伝えた。のちに下野薬師寺・筑紫観世音寺にも戒壇が置かれ、本朝三戒壇と呼ばれた。'},
{p:1,u:'r',e:'古代',t:'k',lv:'標準',g:'2025年度「奈良〜平安初期の仏教」。平安仏教の開祖と著作は記述で狙われる。',q:'天台宗を開き、比叡山に大乗戒壇を設けることを求めて『山家学生式』を著した僧は誰か。',a:'最澄',x:'大乗戒壇の設立は最澄の死後に認められた。最澄は『顕戒論』で南都の僧の反対に反論した。'},
{p:1,u:'r',e:'古代',t:'k',lv:'標準',g:'2023年度「京都に伝わる仏教信仰」。京都の寺院は立命館らしいテーマ。',q:'空海が嵯峨天皇から与えられ、真言宗の根本道場とした京都の寺院を何というか。',a:'教王護国寺',alt:['東寺'],x:'空海は高野山に金剛峯寺も開いた。真言宗の密教は東密、天台宗の密教は台密と呼ばれる。'},
{p:1,u:'r',e:'古代',t:'k',lv:'標準',g:'〔1〕仏教史の頻出人物。浄土教の流れは配列問題にもなる。',q:'985年に『往生要集』を著し、極楽往生の方法を説いた天台宗の僧は誰か。',a:'源信',alt:['恵心僧都'],x:'これより前、10世紀半ばに空也が京の市で念仏を広め「市聖」と呼ばれた。'},
{p:1,u:'r',e:'古代',t:'k',lv:'標準',g:'全学統一方式の〔1〕は3年連続で視覚資料付き(2023〜2025年度)。仏像の作者と技法は図版と組み合わせやすい。',q:'平等院鳳凰堂の阿弥陀如来像を制作し、寄木造の技法を完成させた仏師は誰か。',a:'定朝',x:'寄木造は複数の木材を組み合わせる技法で、大きな像を分業で効率よく作れた。鳳凰堂は藤原頼通が1053年に建立した。'},
{p:1,u:'r',e:'中世',t:'s',lv:'標準',g:'2023年度に『歎異抄』『立正安国論』などの中世仏教史料が出た。鎌倉新仏教の史料は再出題されやすい。',s:'善人なほもて往生をとぐ、いはんや悪人をや。',src:'『歎異抄』',q:'この考え(悪人正機説)を説いた僧は誰か。',a:'親鸞',x:'『歎異抄』は弟子の唯円が親鸞の言葉を記したもの。親鸞の開いた浄土真宗は一向宗とも呼ばれ、のちに蓮如が広めた。'},
{p:1,u:'r',e:'中世',t:'k',lv:'標準',g:'中世仏教は〔1〕〔2〕のどちらにも出る。禅宗の拠点寺院は記述で狙われる。',q:'道元が越前に開いた、曹洞宗の拠点となった寺院を何というか。',a:'永平寺',x:'道元はただひたすら座禅する只管打坐を説いた。弟子の懐奘が道元の言葉を『正法眼蔵随聞記』にまとめた。'},
{p:1,u:'r',e:'中世',t:'k',lv:'基本',g:'2025年度に中世の惣村、2024年度に中世の都市民衆。民衆の自治は〔2〕の中心テーマ。',q:'惣村で、村の運営や祭りについて話し合うために開かれた会議を何というか。',a:'寄合',x:'惣村は乙名・沙汰人などの指導者のもとで自治を行った。神社の祭祀組織である宮座が結合の中心になった。'},
{p:1,u:'r',e:'中世',t:'k',lv:'標準',g:'惣村の自治は用語記述が集中する分野。',q:'惣村が、領主に納める年貢をまとめて請け負ったことを何というか。',a:'地下請',alt:['百姓請','村請'],x:'惣村は自ら惣掟(村法)を定め、違反者を処罰する地下検断も行った。'},
{p:1,u:'r',e:'中世',t:'k',lv:'発展',g:'2024年度「中世〜近世初期の都市下層民衆」。差別された人々の文化的役割は立命館らしい論点。',q:'河原者と呼ばれた人々の一人で、足利義政に重用され東山山荘の庭園づくりに活躍した人物は誰か。',a:'善阿弥',x:'河原者は山水河原者とも呼ばれ、作庭で高い技術を発揮した。龍安寺などの枯山水も室町時代に発達した。'},
{p:1,u:'r',e:'近代',t:'k',lv:'基本',g:'〔3〕で女性史が2年連続(2024・2025年度)。近代女性運動の起点。',q:'1911年、平塚らいてうらが結成し、女性による文芸誌を発行した団体を何というか。',a:'青鞜社',x:'創刊号の「元始、女性は実に太陽であった」で知られる。与謝野晶子も詩を寄せた。'},
{p:1,u:'r',e:'近代',t:'k',lv:'標準',g:'女性史の続き。参政権運動の団体名は記述の定番。',q:'1920年、平塚らいてう・市川房枝らが女性の政治的権利の獲得をめざして結成した団体を何というか。',a:'新婦人協会',x:'治安警察法第5条の改正を求め、1922年に女性の政治集会への参加が認められた。1924年には市川房枝らが婦人参政権獲得期成同盟会を結成した。'},
{p:1,u:'r',e:'近世',t:'k',lv:'発展',g:'女性史は近世から問われる(2024・2025年度「近世〜近代の女性史」)。',q:'江戸時代に広く読まれた、女性に夫や舅姑への従順を説いた教訓書を何というか。',a:'女大学',x:'貝原益軒の著作をもとに作られたとされる。儒教の三従の教えに基づく、男性中心の家の秩序を示している。'},
{p:1,u:'r',e:'近代',t:'k',lv:'標準',g:'2024年度に「近世〜近代の教育」(学制被仰出書・国民学校令などの史料)。教育法令の流れは再出題の可能性。',q:'1886年、文部大臣森有礼のもとで公布された、帝国大学令・師範学校令・中学校令・小学校令の総称を何というか。',a:'学校令',x:'これにより学校体系が整った。1907年には義務教育が6年に延長され、1941年の国民学校令で小学校は国民学校となった。'},
{p:1,u:'r',e:'近代',t:'k',lv:'標準',g:'教育史の続き。原敬内閣の政策としても問われる。',q:'1918年、原敬内閣のもとで制定され、公立・私立の大学の設立を認めた法令を何というか。',a:'大学令',x:'これにより慶應義塾・早稲田などが正式な大学となった。同志社・立命館も大学令に基づく大学に昇格している。'},
{p:1,u:'r',e:'近世',t:'k',lv:'基本',g:'2023年度「近世〜近代の日朝関係」、2025年度「古代〜近世初期の対外関係」。日朝外交は繰り返し出る。',q:'江戸時代、将軍の代替わりなどに朝鮮から派遣された使節を何というか。',a:'朝鮮通信使',alt:['通信使'],x:'1607年から1811年まで計12回来日した(最初の3回は回答兼刷還使)。新井白石は待遇を簡素化した。'},
{p:1,u:'r',e:'近世',t:'k',lv:'発展',g:'日朝関係の細部。対馬藩の役割とあわせて記述で問われる。',q:'1609年、対馬の宗氏と朝鮮の間で結ばれ、日朝貿易の条件を定めた約定を何というか。',a:'己酉約条',x:'釜山に倭館が置かれ、対馬藩が朝鮮貿易を独占した。'},
{p:1,u:'r',e:'近代',t:'k',lv:'基本',g:'赤本の傾向分析で「近代の社会運動史」に注意とされている。',q:'1922年、被差別部落の人々が差別からの解放をめざして結成した団体を何というか。',a:'全国水平社',x:'創立大会で採択された水平社宣言は「人の世に熱あれ、人間に光あれ」と結ばれる。同じ年に日本農民組合・日本共産党も結成された。'},
{p:1,u:'r',e:'近世',t:'k',lv:'標準',g:'2025年度「近世〜大正時代の学者」。思想家と著書の組み合わせは選択・記述の両方で出る。',q:'『自然真営道』を著し、すべての人が耕作する「自然世」を理想として身分制を批判した思想家は誰か。',a:'安藤昌益',x:'八戸の医者。同じ18世紀には、富永仲基・山片蟠桃ら大坂の懐徳堂出身の町人学者も合理的な思想を示した。'},

{p:1,u:'n',e:'現代',t:'k',lv:'標準',g:'2025年度・2026年度ともに複数の日程で占領期が出題。占領政策の転換は定番。',q:'1947年、官公庁労働者を中心に計画されたが、GHQの命令で中止されたゼネラル・ストライキを何というか。',a:'二・一ゼネスト',alt:['二一ゼネスト','2・1ゼネスト'],x:'この後、冷戦の深まりとともに占領政策は日本の経済復興を優先する方向に転換した。'},
{p:1,u:'n',e:'現代',t:'k',lv:'標準',g:'占領期の経済政策は2026年度にも出題。九原則→ドッジ・ライン→シャウプ勧告の流れで問われる。',q:'1948年、GHQが日本経済の自立のために第2次吉田茂内閣に示した指令を何というか。',a:'経済安定九原則',x:'予算の均衡・徴税の強化・賃金の安定などを求めた。翌1949年、これを実行するためドッジ・ラインとシャウプ勧告が出された。'},
{p:1,u:'n',e:'現代',t:'k',lv:'標準',g:'占領期の経済政策の流れ。',q:'1949年、直接税中心の税制への改革を勧告したアメリカの使節団の名にちなむ勧告を何というか。',a:'シャウプ勧告',x:'所得税中心の直接税主義や地方財政の強化などが示された。'},
{p:1,u:'n',e:'近代',t:'k',lv:'標準',g:'2025年度に「満洲事変以降の国際関係・日中戦争・戦時体制」。開戦前の日米交渉は狙われやすい。',q:'1941年11月、アメリカが日本に中国・仏印からの全面撤兵などを求めた提案を何というか。',a:'ハル・ノート',alt:['ハルノート'],x:'東条英機内閣はこれを最後通告とみなし、12月8日にハワイ真珠湾攻撃とマレー半島上陸で開戦した。'},
{p:1,u:'n',e:'近代',t:'k',lv:'標準',g:'戦時の国際関係。枢軸形成の順番(防共協定→三国同盟)は頻出。',q:'1936年、広田弘毅内閣が共産主義に対抗するためドイツと結んだ協定を何というか。',a:'日独防共協定',alt:['日独防共協定'],x:'翌1937年にイタリアが加わり日独伊三国防共協定となった。1940年の日独伊三国同盟で軍事同盟に発展した。'},
{p:1,u:'n',e:'近世',t:'k',lv:'標準',g:'2025年度に綱吉〜定信の政治、2026年度に江戸後期の蝦夷地と対ロシア政策。田沼期の蝦夷地政策が交わる。',q:'ロシアとの交易や蝦夷地開発を説いた『赤蝦夷風説考』を著し、田沼意次に影響を与えた人物は誰か。',a:'工藤平助',x:'田沼意次はこれを受けて最上徳内らを蝦夷地調査に派遣した。林子平は『海国兵談』で海防を説き、寛政の改革で処罰された。'},
{p:1,u:'n',e:'近世',t:'k',lv:'標準',g:'江戸の三大改革は毎年いずれかの日程で出ている。天保の改革の農村政策。',q:'天保の改革で、江戸に流入した農民を強制的に村へ帰らせた法令を何というか。',a:'人返しの法',alt:['人返し令'],x:'寛政の改革の旧里帰農令は帰村を奨励するものだったが、人返しの法は強制だった。'},
{p:1,u:'n',e:'近世',t:'k',lv:'標準',g:'2025年度「江戸時代の貿易・外交、朝鮮・琉球・アイヌとの関係」。アイヌとの関係の定番。',q:'1669年、蝦夷地のアイヌが松前藩の不公正な交易に反発して起こした戦いを何というか。',a:'シャクシャインの戦い',alt:['シャクシャインの蜂起'],x:'鎮圧後、アイヌは松前藩への従属を強められた。18世紀には商人が交易を請け負う場所請負制が広がった。'},
{p:1,u:'n',e:'近世',t:'k',lv:'発展',g:'琉球との関係も「四つの口」としてまとめて出題される。',q:'琉球王国が、徳川将軍の代替わりの際に江戸へ派遣した使節を何というか。',a:'慶賀使',x:'琉球国王の代替わりの際には謝恩使を派遣した。琉球は1609年に薩摩藩に征服された後も、明・清への朝貢を続けた。'},
{p:1,u:'n',e:'古代',t:'k',lv:'基本',g:'2025年度に縄文〜古墳の埋葬・祭祀、2026年度に旧石器〜弥生の道具。原始は毎年どこかの日程で出ている。',q:'青森県にある、縄文時代前期〜中期の大規模な集落遺跡を何というか。',a:'三内丸山遺跡',x:'大型の掘立柱建物の跡や、クリの栽培の痕跡が見つかっている。2021年に「北海道・北東北の縄文遺跡群」として世界遺産に登録された。'},
{p:1,u:'n',e:'古代',t:'k',lv:'基本',g:'2026年度「旧石器〜弥生時代の道具」。道具の名前と用途は基本知識として繰り返し問われる。',q:'弥生時代、稲の穂首を刈り取るのに使われた石器を何というか。',a:'石包丁',x:'収穫した稲は高床倉庫や貯蔵穴に保管された。弥生時代には鉄器や青銅器も伝わった。'},
{p:1,u:'n',e:'古代',t:'k',lv:'基本',g:'2025年度に古墳時代の埋葬が出題。代表的な古墳の名前は基本。',q:'大阪府堺市にある、墳丘の長さが日本最大の前方後円墳を何というか。',a:'大仙陵古墳',alt:['大山古墳','仁徳天皇陵古墳','大仙古墳'],x:'5世紀の中期古墳。2019年に「百舌鳥・古市古墳群」として世界遺産に登録された。'},
{p:1,u:'n',e:'中世',t:'k',lv:'標準',g:'2025年度に「中世惣村・応仁の乱と戦国時代」。室町幕府の動揺の起点となる事件。',q:'1441年、播磨の守護赤松満祐が6代将軍足利義教を殺害した事件を何というか。',a:'嘉吉の変',x:'この直後に嘉吉の徳政一揆が起き、幕府は初めて徳政令を出した。将軍の権威は大きく揺らいだ。'},
{p:1,u:'n',e:'中世',t:'s',lv:'標準',g:'2025年度に「地頭補任状の史料読解、鎌倉幕府の支配原理」。御成敗式目の守護・地頭の条文は定番史料。',s:'一　諸国守護人奉行の事\n右、右大将家の御時定め置かるる所は、大番催促・謀叛・殺害人付たり、夜討・強盗・山賊・海賊等の事なり。',src:'御成敗式目',q:'この条文が定めた守護の基本的な3つの職務を何というか。',a:'大犯三カ条',alt:['大犯三箇条','大犯三か条'],x:'大番催促(京都大番役の催促)・謀叛人の逮捕・殺害人の逮捕の3つ。室町時代には刈田狼藉の取締りと使節遵行の権限が加わった。'},
{p:1,u:'n',e:'現代',t:'s',lv:'標準',g:'2025年度に「講和問題と日米安全保障条約」、2026年度に「冷戦開始と朝鮮戦争」。講和条約の条文は史料として出やすい。',s:'第二条　(a)日本国は、朝鮮の独立を承認して、済州島、巨文島及び鬱陵島を含む朝鮮に対するすべての権利、権原及び請求権を放棄する。',src:'',q:'1951年に調印されたこの条約を何というか。',a:'サンフランシスコ平和条約',alt:['サンフランシスコ講和条約','対日平和条約'],x:'台湾・澎湖諸島、千島列島・南樺太の放棄も定め、沖縄・小笠原はアメリカの施政権下に置かれた。ソ連などは調印せず、中国は会議に招かれなかった。'},
{p:1,u:'n',e:'近代',t:'k',lv:'標準',g:'2025年度に「戸長を通じた学制・徴兵制・地租改正・地方自治」。明治初期の制度は再出題の可能性が高い。',q:'1872年に作られた、全国統一の基準による最初の戸籍を、作成された年の干支にちなんで何というか。',a:'壬申戸籍',x:'1871年の戸籍法に基づいて作られた。華族・士族・平民などの族籍が記載された。'},
{p:1,u:'n',e:'近世',t:'k',lv:'標準',g:'2025年度全学統一で「古代から近代までの歴史書と歴史叙述」の通史問題。歴史書は南山の文化史で狙われる。',q:'水戸藩主徳川光圀が編纂を始め、完成が明治時代までかかった歴史書を何というか。',a:'大日本史',x:'1657年に編纂が始まり、1906年に完成した。編纂の過程で形成された水戸学は、幕末の尊王攘夷思想に影響を与えた。'},
{p:1,u:'n',e:'近代',t:'k',lv:'基本',g:'2026年度に「大正デモクラシー」、2025年度に「関東大震災・大正の社会」。大正期の社会運動は頻出。',q:'1918年、シベリア出兵を見越した米の買い占めで米価が急騰し、富山県から全国に広がった騒動を何というか。',a:'米騒動',x:'寺内正毅内閣は軍隊を出動させて鎮めたが、責任を取って総辞職し、原敬の政党内閣が成立した。'},

// ===== 状態 =====
const UNIV = {all:'全大学',d:'同志社',r:'立命館',n:'南山'};
const ERAS = ['すべて','古代','中世','近世','近代','現代'];
const TYPES = {all:'すべて',k:'一問一答',s:'史料問題',pred:'予想問題',miss:'間違えた問題'};
const KEY = 'nihonshi-drill-v1', PKEY = 'nihonshi-drill-filter';
let state = {u:'all', e:'すべて', t:'all'};
let rec = {};
try{ rec = JSON.parse(localStorage.getItem(KEY)||'{}') }catch(_){ rec = {} }
try{ Object.assign(state, JSON.parse(localStorage.getItem(PKEY)||'{}')) }catch(_){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(rec)); localStorage.setItem(PKEY, JSON.stringify(state)) }catch(_){} };

let current = -1, lastShown = -1, answered = false, lastResult = null, lastInput = null;
const $ = id => document.getElementById(id);

// ===== 条件シート =====
function chips(id, entries, key){
  const box = $(id); box.innerHTML = '';
  entries.forEach(([val,label])=>{
    const b = document.createElement('button');
    b.className='chip'; b.type='button'; b.textContent=label;
    b.setAttribute('aria-pressed', state[key]===val);
    b.onclick = ()=>{ state[key]=val; save(); renderFilters(); };
    box.appendChild(b);
  });
}
function renderFilters(){
  chips('f-u', Object.entries(UNIV), 'u');
  chips('f-e', ERAS.map(x=>[x, x==='すべて'?'全時代':x]), 'e');
  chips('f-t', Object.entries(TYPES), 't');
  $('condLabel').textContent = [UNIV[state.u], state.e==='すべて'?'全時代':state.e, TYPES[state.t]==='すべて'?'全形式':TYPES[state.t]].join('・');
  renderStats();
}
function openSheet(){ $('scrim').hidden=false; $('sheet').hidden=false; }
function closeSheet(){ $('scrim').hidden=true; $('sheet').hidden=true; next(); }
$('openF').onclick = openSheet;
$('closeF').onclick = closeSheet;
$('scrim').onclick = closeSheet;
let resetArmed=false;
$('resetRec').onclick = e=>{
  if(!resetArmed){ resetArmed=true; e.target.textContent='もう一度押すとリセットします'; return; }
  rec={}; save(); resetArmed=false; e.target.textContent='成績をリセットしました'; renderStats();
};

function pool(){
  return Q.map((q,i)=>i).filter(i=>{
    const q = Q[i];
    if(state.u!=='all' && q.u!==state.u) return false;
    if(state.e!=='すべて' && q.e!==state.e) return false;
    if(state.t==='miss') return rec[i] && rec[i].last===false;
    if(state.t==='pred') return !!q.p;
    if(state.t!=='all' && q.t!==state.t) return false;
    return true;
  });
}
function renderStats(){
  const p = pool();
  let c=0,w=0; p.forEach(i=>{ if(rec[i]){ c+=rec[i].c; w+=rec[i].w } });
  const tried = p.filter(i=>rec[i]).length;
  const miss = Q.filter((_,i)=>rec[i] && rec[i].last===false).length;
  const rate = c+w ? Math.round(c/(c+w)*100)+'%' : '—';
  $('stats').innerHTML = `<span>対象 <b>${p.length}</b></span><span>解いた <b>${tried}</b></span><span>正答率 <b>${rate}</b></span><span>要復習 <b>${miss}</b></span>`;
}

// ===== 採点 =====
const norm = s => (s||'').normalize('NFKC').replace(/[\s・、,，.。「」『』()（）\-ー〜~=＝]/g,'').replace(/ヶ|ケ/g,'カ');
const judge = (input, q) => { const n = norm(input); return !!n && [q.a, ...(q.alt||[])].some(x=>norm(x)===n); };

// ===== 表示 =====
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function next(){
  const p = pool();
  const card = $('card'), bar = $('bar');
  document.querySelector('.main').scrollTop = 0;
  if(!p.length){
    card.innerHTML = `<p class="empty">${state.t==='miss' ? '間違えた問題はまだありません。' : 'この条件の問題はありません。'}</p>`;
    bar.innerHTML = `<button class="btn wide" type="button" id="toF">条件を変える</button>`;
    $('toF').onclick = openSheet;
    current=-1; renderStats(); return;
  }
  let i; do{ i = p[Math.floor(Math.random()*p.length)] }while(p.length>1 && i===lastShown);
  current = lastShown = i; answered=false; lastResult=null; lastInput=null;
  const q = Q[i];
  card.innerHTML = `
    <div class="meta"><span class="tag u ${q.u}">${UNIV[q.u]}</span><span class="tag">${q.e}</span><span class="tag">${q.t==='s'?'史料':'一問一答'}</span>${q.p?'<span class="tag pred">予想</span>':''}<span class="lv">${q.lv}</span></div>
    ${q.s ? `<div class="shiryo">${esc(q.s).replace(/\n/g,'<br>')}${q.src?`<cite>${esc(q.src)}</cite>`:''}</div>` : ''}
    <p class="q">${esc(q.q)}</p>
    <div id="res"></div>`;
  bar.innerHTML = `
    <form class="row" id="f"><label for="ans" hidden>解答</label><input type="text" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="漢字で答えを入力"><button class="btn" type="submit">答え合わせ</button></form>
    <div class="row"><button class="btn ghost sm wide" type="button" id="reveal">答えを見る</button><button class="btn ghost sm wide" type="button" id="skip">別の問題</button></div>`;
  $('f').onsubmit = e=>{ e.preventDefault(); const v=$('ans').value; $('ans').blur(); grade(v) };
  $('reveal').onclick = ()=>grade(null);
  $('skip').onclick = next;
  renderStats();
}
function setRec(i, ok, prev){
  const r = rec[i] || {c:0,w:0,last:null};
  if(prev===true) r.c--; else if(prev===false) r.w--;
  if(ok) r.c++; else r.w++;
  r.last = ok; rec[i]=r; save();
}
function grade(input){
  if(answered || current<0) return;
  answered = true; lastInput = input;
  const ok = input===null ? false : judge(input,Q[current]);
  setRec(current, ok, null); lastResult = ok;
  showResult();
}
function showResult(){
  const q = Q[current], ok = lastResult, input = lastInput;
  const yours = input===null ? '答えを見ました' : `あなたの答え:${esc(input)||'(未入力)'}`;
  $('res').innerHTML = `
    <div class="result ${ok?'ok':'ng'}">
      <div class="verdict"><span class="mark">${ok?'○':'×'}</span><span class="ansblk">${YOMI[q.a]?`<span class="yomi">${esc(YOMI[q.a])}</span>`:''}<span class="correct">${esc(q.a)}</span></span></div>
      <span class="yours">${yours}${q.alt&&q.alt.length?` / 別解:${q.alt.map(esc).join('、')}`:''}</span>
      <p class="exp">${esc(q.x)}</p>
      ${KANREN[q.a]?`<div class="rel"><b>関連して覚える</b><ul>${KANREN[q.a].map(s=>{const i=s.indexOf(':');return i>0?`<li><strong>${esc(s.slice(0,i))}</strong>${esc(s.slice(i+1))}</li>`:`<li><strong>${esc(s)}</strong></li>`}).join('')}</ul></div>`:''}
      ${q.g?`<p class="why"><b>予想の根拠</b>${esc(q.g)}</p>`:''}
    </div>`;
  $('bar').innerHTML = `<div class="row"><button class="btn ghost" type="button" id="flip">${ok?'×にする':'○にする'}</button><button class="btn wide" type="button" id="nx">次の問題</button></div>`;
  $('nx').onclick = next;
  $('flip').onclick = ()=>{ const nv=!lastResult; setRec(current, nv, lastResult); lastResult=nv; showResult(); renderStats(); };
  $('res').scrollIntoView({block:'nearest'});
  renderStats();
}

renderFilters();
next();
</script>
