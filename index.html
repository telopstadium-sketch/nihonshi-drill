<script>
// ===== 問題データ =====
// u: d=同志社 r=立命館 n=南山 / e: 時代 / t: k=一問一答 s=史料 / lv: 基本・標準・発展
const Q = [
// ---------- 南山(基本〜標準) ----------
{u:'n',e:'古代',t:'k',lv:'基本',q:'宮都の跡などから出土し、税の荷札や文書として使われた、墨で文字を書いた木の札を何というか。',a:'木簡',x:'藤原宮・平城宮跡などから大量に出土。藤原宮の木簡には「評」の表記があり、大宝令で「郡」に改められたことが確かめられた。地方行政や税(調・庸)の実態を知る重要史料。'},
{u:'n',e:'古代',t:'k',lv:'基本',q:'694年に持統天皇が遷った、日本で最初の本格的な都城を何というか。',a:'藤原京',x:'中国の都城制にならい、条坊制をもつ初の本格的都城。710年に元明天皇が平城京へ遷都するまで続いた。'},
{u:'n',e:'古代',t:'k',lv:'基本',q:'律令制で成年男子に課された、都での労役(歳役)の代わりに布などを納める税を何というか。',a:'庸',x:'租(稲)・調(特産物)・庸(布)の一つ。調と庸は農民自身が都まで運ぶ(運脚)必要があり、重い負担だった。'},
{u:'n',e:'古代',t:'k',lv:'基本',q:'603年に定められ、個人の才能や功績に応じて冠を与え、氏族単位の地位を改めようとした制度を何というか。',a:'冠位十二階',x:'厩戸王(聖徳太子)・蘇我馬子らの政治。翌604年の憲法十七条とともに、中央集権化と遣隋使外交の準備にあたる。'},
{u:'n',e:'古代',t:'k',lv:'標準',q:'663年、倭が百済復興を支援して、唐・新羅の連合軍に大敗した戦いを何というか。',a:'白村江の戦い',alt:['白村江'],x:'敗戦後、中大兄皇子は対馬・壱岐・筑紫に防人と烽を置き、大宰府の北に水城、西日本各地に朝鮮式山城を築いて防衛を固めた。'},
{u:'n',e:'古代',t:'k',lv:'標準',q:'5世紀ごろ渡来人が伝えた技術で作られた、ろくろを使い高温で焼いた灰色の硬い土器を何というか。',a:'須恵器',x:'それまでの赤褐色の土師器に対し、窖窯で高温焼成する。渡来人は鉄器・機織り・漢字なども伝えた。'},
{u:'n',e:'古代',t:'s',lv:'基本',s:'一に曰く、和を以て貴しと為し、忤ふること無きを宗とせよ。……二に曰く、篤く三宝を敬へ。三宝とは仏・法・僧なり。',src:'『日本書紀』',q:'この史料は604年に定められたとされる法の一部である。この法を何というか。',a:'憲法十七条',alt:['十七条憲法','十七条の憲法'],x:'豪族に官人としての心構えを説いたもの。仏教を重んじる姿勢(三宝)や、天皇への服従(詔を承りては必ず謹め)が示されている。'},
{u:'n',e:'中世',t:'k',lv:'基本',q:'1333年の鎌倉幕府滅亡後、後醍醐天皇が始めた天皇中心の政治を何というか。',a:'建武の新政',alt:['建武新政'],x:'天皇の綸旨を絶対としたため所領問題が混乱し、武士の不満が高まった。1335年の中先代の乱を機に足利尊氏が離反し、約3年で崩壊した。'},
{u:'n',e:'中世',t:'k',lv:'標準',q:'建武政権で、所領に関する訴訟を処理するために置かれた機関を何というか。',a:'雑訴決断所',x:'中央には記録所・雑訴決断所・恩賞方・武者所が置かれた。所領争いの急増に対応するため設けられた。'},
{u:'n',e:'中世',t:'k',lv:'標準',q:'「此比都ニハヤル物、夜討強盗謀綸旨」で始まり、建武政権下の混乱を風刺した落書を何というか。',a:'二条河原落書',x:'京都の二条河原に掲げられたとされ、『建武年間記』に収められる。偽の綸旨(謀綸旨)が出回る混乱ぶりを伝える。'},
{u:'n',e:'中世',t:'k',lv:'基本',q:'平清盛が修築し、日宋貿易の拠点とした摂津の港を何というか。',a:'大輪田泊',x:'現在の神戸港の一部。清盛は1180年に近くの福原へ遷都したが、反発が強く半年ほどで京都に戻った。'},
{u:'n',e:'中世',t:'k',lv:'標準',q:'1219年、鎌倉の鶴岡八幡宮で3代将軍源実朝を暗殺した人物は誰か。',a:'公暁',x:'公暁は2代将軍頼家の子。源氏の将軍が途絶えたことで、幕府は摂関家から藤原頼経を迎えた(摂家将軍)。'},
{u:'n',e:'近世',t:'k',lv:'標準',q:'1651年の慶安の変(由井正雪の乱)の後、牢人の増加を防ぐため幕府が緩めた禁令を何というか。',a:'末期養子の禁',alt:['末期養子の禁止'],x:'4代家綱のもとで緩和され、武断政治から文治政治への転換の象徴とされる。50歳未満の大名の末期養子が認められた。'},
{u:'n',e:'近世',t:'k',lv:'基本',q:'5代将軍徳川綱吉が出した、犬をはじめとする生き物の殺生を禁じた一連の法令を何というか。',a:'生類憐みの令',alt:['生類憐れみの令'],x:'1685年頃から出され、極端な運用で人々を苦しめた。一方で殺生や暴力を嫌う風潮を広める面もあった。綱吉の死後に廃止。'},
{u:'n',e:'近世',t:'k',lv:'標準',q:'1792年に根室へ来航し、漂流民大黒屋光太夫を送り届けて通商を求めたロシア使節は誰か。',a:'ラクスマン',x:'幕府は長崎入港の許可証(信牌)を渡して帰した。1804年にはその信牌を持ったレザノフが長崎に来航した。'},
{u:'n',e:'近世',t:'k',lv:'標準',q:'1808年に樺太を探査し、樺太が島であることを確認した人物は誰か。',a:'間宮林蔵',x:'樺太と大陸の間の海峡は間宮海峡と呼ばれる。同じ時期、近藤重蔵らが択捉島を探査した。'},
{u:'n',e:'近世',t:'k',lv:'標準',q:'河村瑞賢が整備した、日本海沿岸から下関を回って大坂へ至る航路を何というか。',a:'西廻り航路',alt:['西回り航路'],x:'東北から太平洋側を江戸へ向かう東廻り航路も瑞賢が整備した。のちに北前船が西廻り航路で活躍した。'},
{u:'n',e:'近世',t:'k',lv:'基本',q:'商工業者が結成し、田沼意次が営業の独占を認める代わりに運上・冥加を納めさせた同業組合を何というか。',a:'株仲間',x:'天保の改革で水野忠邦は物価高の原因として解散を命じたが、かえって流通が混乱し、1851年に再興が認められた。'},
{u:'n',e:'近代',t:'s',lv:'基本',s:'自今以後、一般ノ人民華士族卒農工商及婦女子必ス邑ニ不学ノ戸ナク、家ニ不学ノ人ナカラシメン事ヲ期ス。',src:'学事奨励に関する太政官布告(被仰出書)',q:'この方針のもと、1872年に公布された近代的学校制度を何というか。',a:'学制',x:'フランスの制度にならい全国を学区に分けた。授業料が自己負担だったため就学率は伸び悩み、1879年の教育令で改められた。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'1890年に発布され、忠君愛国を国民教育の基本とした文書を何というか。',a:'教育勅語',alt:['教育ニ関スル勅語','教育に関する勅語'],x:'元田永孚・井上毅らが起草。1891年には内村鑑三が勅語への拝礼をためらったとして職を追われた(内村鑑三不敬事件)。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'1872年に日本で最初に開業した鉄道は、どこからどこまでの区間か。',a:'新橋・横浜間',alt:['新橋横浜','新橋〜横浜','新橋-横浜','新橋から横浜','新橋横浜間'],x:'イギリスの技術と資金を導入。1874年には大阪・神戸間も開通した。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'足尾銅山鉱毒事件で被害を訴え続け、1901年に天皇への直訴を試みた元衆議院議員は誰か。',a:'田中正造',x:'渡良瀬川流域の農漁業に大きな被害が出た。政府は谷中村を廃村にして遊水池を設けた。日本の公害問題の原点とされる。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'吉野作造が唱えた、主権の所在は問わず、政治の目的を民衆の幸福におき政策決定に民衆の意向を重んじるという考えを何というか。',a:'民本主義',x:'美濃部達吉の天皇機関説とともに大正デモクラシーを支えた理論。吉野は黎明会を結成し、学生は東大新人会をつくった。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'1925年、加藤高明内閣のもとで成立し、満25歳以上の男性に選挙権を与えた法律を何というか。',a:'普通選挙法',x:'納税額による制限が撤廃され、有権者は約4倍に増えた。女性の参政権は1945年の選挙法改正で実現した。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'普通選挙法と同じ1925年に制定され、「国体」の変革や私有財産制度の否認を目的とする結社を取り締まった法律を何というか。',a:'治安維持法',x:'日ソ基本条約による国交樹立や普通選挙による社会主義勢力の伸長に備えたもの。1928年に最高刑が死刑に引き上げられた。'},
{u:'n',e:'現代',t:'k',lv:'基本',q:'寄生地主制を解体し、多くの自作農を生んだ占領期の改革を何というか。',a:'農地改革',x:'1946年からの第二次農地改革では、不在地主の全貸付地と、在村地主の一定面積(内地は平均1町歩)を超える貸付地を国が買い上げ、小作人に安く売り渡した。'},
{u:'n',e:'現代',t:'k',lv:'標準',q:'1949年のドッジ・ラインで設定された単一為替レートは、1ドル=何円か。',a:'360円',alt:['360'],x:'超均衡予算とあわせてインフレは収束したが、不況が深刻化した。1950年の朝鮮戦争による特需で景気は回復した。'},
{u:'n',e:'現代',t:'k',lv:'基本',q:'1951年、サンフランシスコ平和条約と同じ日に調印され、独立後も米軍の日本駐留を認めた条約を何というか。',a:'日米安全保障条約',alt:['日米安保条約','安保条約'],x:'吉田茂首相が調印。米軍の日本防衛義務が明記されないなど不平等な面があり、1960年に岸信介内閣が改定した。'},
{u:'n',e:'現代',t:'k',lv:'標準',q:'1989年12月、米ソ首脳が地中海の島で会談し、冷戦の終結を宣言した会談を何というか。',a:'マルタ会談',x:'ブッシュ(父)とゴルバチョフによる。1990年にドイツが統一し、1991年にソ連が解体した。'},
{u:'n',e:'現代',t:'k',lv:'標準',q:'1992年に成立し、自衛隊のカンボジア派遣の根拠となった法律を何というか。',a:'PKO協力法',alt:['国連平和維持活動協力法','PKO法'],x:'宮沢喜一内閣のもとで成立。湾岸戦争で資金協力しかしなかったことへの国際的批判がきっかけとなった。'},

// ---------- 立命館(記述中心・漢字の正確さ・やや難) ----------
{u:'r',e:'古代',t:'k',lv:'標準',q:'723年に出され、新たに灌漑施設をつくって開墾した土地は三代、既存の施設を使った場合は本人一代の私有を認めた法令を何というか。',a:'三世一身法',x:'口分田の不足を補うため長屋王政権が出した。期限が近づくと耕作が放棄されたため、743年に墾田永年私財法が出された。'},
{u:'r',e:'古代',t:'s',lv:'標準',s:'……今より以後は任に私財と為し、三世一身を論ずること無く、咸悉くに永年取る莫れ。',src:'『続日本紀』',q:'743年に出されたこの法令を何というか。',a:'墾田永年私財法',x:'聖武天皇のもとで出され、身分に応じて開墾できる面積に上限があった。貴族・寺社が開墾を進め、初期荘園が生まれるきっかけとなった。'},
{u:'r',e:'古代',t:'k',lv:'標準',q:'792年、桓武天皇が一部の地域を除き軍団を廃止した代わりに、郡司の子弟などから採用した兵を何というか。',a:'健児',x:'農民の兵役負担を軽くするための改革。東北や九州など辺境では軍団が残された。'},

{u:'r',e:'古代',t:'k',lv:'発展',q:'902年、醍醐天皇のもとで出された最初の荘園整理令を何というか。',a:'延喜の荘園整理令',alt:['延喜の荘園整理'],x:'同じ年には最後の班田が行われたとされる。律令制の立て直しをめざした「延喜・天暦の治」の一環。'},
{u:'r',e:'古代',t:'k',lv:'発展',q:'1069年、後三条天皇が荘園の証拠書類を審査するために設けた機関を何というか。',a:'記録荘園券契所',alt:['記録所'],x:'基準に合わない荘園は摂関家領でも停止させ、成果をあげた。後三条天皇は摂関家を外戚としない天皇だった。'},

{u:'r',e:'中世',t:'k',lv:'標準',q:'鎌倉時代、地頭と荘園領主が荘園の土地そのものを分け合い、互いの支配に干渉しないことにした解決方法を何というか。',a:'下地中分',x:'このほか、地頭に荘園の管理を任せて一定の年貢納入を請け負わせる地頭請(所)もあった。'},
{u:'r',e:'中世',t:'k',lv:'発展',q:'1352年に初めて出され、守護に国内の荘園・公領の年貢の半分を兵粮米として徴収する権限を与えた法令を何というか。',a:'半済令',alt:['観応の半済令'],x:'最初は近江・美濃・尾張の3国に1年限りで認められたが、やがて全国に広がり永続化した。守護大名化を進める要因になった。'},
{u:'r',e:'中世',t:'s',lv:'発展',s:'正長元年ヨリサキ者、カンヘ四カンカウニヲヰメアルヘカラス',src:'柳生の徳政碑文',q:'この碑文は、ある一揆によって正長元年以前の負債が帳消しになったことを記したものである。この一揆を何というか。',a:'正長の徳政一揆',alt:['正長の土一揆','正長の一揆'],x:'1428年、近江坂本の馬借の蜂起から始まり、京都の土倉・酒屋などを襲った。神戸(かんべ)四箇郷に「負い目(借金)」はないという意味。'},
{u:'r',e:'中世',t:'k',lv:'標準',q:'1485年、南山城の国人らが両畠山氏の軍を国外に退去させ、8年間自治を行った一揆を何というか。',a:'山城の国一揆',alt:['山城国一揆'],x:'1488年には加賀の一向一揆が守護富樫政親を倒し、約100年にわたり門徒が加賀を支配した。'},

{u:'r',e:'中世',t:'k',lv:'標準',q:'足利義政の東山山荘にある東求堂同仁斎に見られる、床の間・違い棚・付書院をもつ住宅様式を何というか。',a:'書院造',x:'現在の和風住宅の原型。同じ東山山荘の観音殿(銀閣)は、下層が書院造、上層が禅宗様の仏殿という構造。'},
{u:'r',e:'近世',t:'k',lv:'基本',q:'1588年、豊臣秀吉が一揆を防ぎ農民を耕作に専念させるため、百姓から武器を没収した法令を何というか。',a:'刀狩令',x:'没収した武器は方広寺の大仏造営に使うと説明された。1591年の人掃令とあわせて兵農分離が進んだ。'},
{u:'r',e:'近世',t:'k',lv:'基本',q:'1615年、2代将軍秀忠の名で出された大名統制の法令を何というか。',a:'武家諸法度',alt:['元和令'],x:'金地院崇伝が起草。城の新築禁止や修理の届出、大名同士の無許可の婚姻禁止などを定めた。1635年の寛永令で参勤交代が制度化された。'},
{u:'r',e:'近世',t:'k',lv:'標準',q:'享保の改革で、大名に石高1万石につき100石の米を上納させる代わりに、参勤交代の在府期間を半年に縮めた制度を何というか。',a:'上げ米',alt:['上米'],x:'8代将軍吉宗による財政再建策。幕府財政が立ち直った1730年に停止された。'},
{u:'r',e:'近世',t:'k',lv:'発展',q:'寛政の改革で、飢饉に備えて諸大名に1万石につき50石の米を蓄えさせた政策を何というか。',a:'囲米',x:'松平定信による。各地に社倉・義倉もつくらせた。江戸では七分積金で町入用の節約分を積み立てさせた。'},
{u:'r',e:'近世',t:'k',lv:'発展',q:'1843年、水野忠邦が江戸・大坂周辺の大名・旗本領を幕府の直轄地にしようとして失敗した法令を何というか。',a:'上知令',alt:['上地令'],x:'財政の安定と海防強化が目的だったが、大名・旗本の反対で撤回され、忠邦は老中を失脚した。'},
{u:'r',e:'近代',t:'k',lv:'基本',q:'1873年に始まり、課税の基準を収穫高から地価に改め、地価の3%を金納させた改革を何というか。',a:'地租改正',x:'政府の財政は安定したが、負担は江戸時代とほぼ変わらず各地で一揆が起きた。1877年に税率は2.5%に引き下げられた。'},
{u:'r',e:'近代',t:'s',lv:'発展',s:'臣等伏シテ方今政権ノ帰スル所ヲ察スルニ、上帝室ニ在ラス、下人民ニ在ラス、而独有司ニ帰ス。',src:'『日新真事誌』',q:'1874年、板垣退助らが左院に提出したこの文書を何というか。',a:'民撰議院設立の建白書',alt:['民選議院設立建白書','民撰議院設立建白書','民選議院設立の建白書'],x:'「有司」とは大久保利通ら一部の官僚。有司専制を批判し、国会の開設を求めた。自由民権運動の出発点となった。'},
{u:'r',e:'近代',t:'k',lv:'標準',q:'明治十四年の政変の際に出され、1890年の国会開設を約束した天皇の言葉を何というか。',a:'国会開設の勅諭',x:'開拓使官有物払下げ事件で政府批判が高まる中、大隈重信を罷免するとともに出された。'},
{u:'r',e:'近代',t:'k',lv:'標準',q:'1911年、小村寿太郎外相のもとで完全な回復が実現した、条約改正の課題は何か。',a:'関税自主権',x:'領事裁判権(治外法権)の撤廃は1894年、陸奥宗光外相のもとで日英通商航海条約により実現した。'},
{u:'r',e:'近代',t:'k',lv:'基本',q:'1918年、米騒動の後に立憲政友会総裁として本格的な政党内閣を組織した人物は誰か。',a:'原敬',x:'爵位をもたない衆議院議員だったため「平民宰相」と呼ばれた。1921年に東京駅で暗殺された。'},
{u:'r',e:'近代',t:'k',lv:'標準',q:'1938年、第1次近衛文麿内閣のもとで制定され、議会の承認なしに労働力や物資を戦争に動員できるようにした法律を何というか。',a:'国家総動員法',x:'翌1939年には、これに基づく勅令として国民徴用令が出された。'},

{u:'d',e:'古代',t:'s',lv:'標準',s:'倭人は〔　〕の東南大海の中に在り、山島に依りて国邑を為す。旧百余国。',src:'『魏志』倭人伝',q:'空欄に入る、朝鮮半島に置かれた中国の郡の名を答えよ。',a:'帯方',alt:['帯方郡'],x:'帯方郡は3世紀初めに楽浪郡の南に置かれた。邪馬台国の卑弥呼は239年、帯方郡を通じて魏に使いを送った。'},

{u:'d',e:'古代',t:'s',lv:'発展',s:'其の一に曰く、昔在の天皇等の立てたまへる子代の民、処々の屯倉、及び別には臣・連・伴造・国造・村首の所有る部曲の民、処々の田荘を罷めよ。',src:'『日本書紀』',q:'646年に出されたとされるこの詔を何というか。',a:'改新の詔',x:'王族や豪族の私有地・私有民を廃止する公地公民の方針を示した。詔の文章には後の大宝令による修飾があると考えられている(郡評論争)。'},
{u:'d',e:'古代',t:'k',lv:'標準',q:'刑部親王とともに大宝律令の編纂の中心となった人物は誰か。',a:'藤原不比等',x:'中臣鎌足の子。のちに養老律令の編纂も主導した。娘の宮子は文武天皇に、光明子は聖武天皇に嫁いだ。'},
{u:'d',e:'古代',t:'k',lv:'標準',q:'740年、玄昉や吉備真備の排除を求めて九州で反乱を起こした人物は誰か。',a:'藤原広嗣',x:'大宰少弐として大宰府で挙兵したが鎮圧された。乱の後、聖武天皇は恭仁京・難波宮・紫香楽宮と都を移した。'},
{u:'d',e:'古代',t:'k',lv:'標準',q:'866年、応天門の放火の罪を問われて流罪となった大納言は誰か。',a:'伴善男',x:'この事件を機に藤原良房が正式に摂政となった。事件は絵巻物『伴大納言絵巻』に描かれている。'},
{u:'d',e:'古代',t:'k',lv:'発展',q:'969年の安和の変で、大宰府に左遷された左大臣は誰か。',a:'源高明',x:'この事件で藤原氏の他氏排斥は完了し、以後ほぼ常に摂政・関白が置かれるようになった。'},
{u:'d',e:'古代',t:'k',lv:'発展',q:'1019年、沿海州方面の女真族が対馬・壱岐・九州北部を襲った事件を何というか。',a:'刀伊の入寇',x:'大宰権帥の藤原隆家が九州の武士を率いて撃退した。地方武士の実力を示した事件でもある。'},
{u:'d',e:'古代',t:'k',lv:'標準',q:'白河上皇が院の御所の警護のために組織した武士を何というか。',a:'北面の武士',x:'院政の軍事力となり、平正盛・忠盛らの伊勢平氏が院と結びついて台頭するきっかけになった。'},
{u:'d',e:'中世',t:'s',lv:'標準',s:'皆心を一にして奉るべし。是れ最期の詞なり。故右大将軍朝敵を征罰し、関東を草創してより以降、官位と云ひ俸禄と云ひ、其の恩既に山岳よりも高く、溟渤よりも深し。',src:'『吾妻鏡』',q:'承久の乱に際して御家人に結束を訴えた、この言葉の主は誰か。',a:'北条政子',x:'「故右大将軍」は源頼朝。乱後、幕府は京都に六波羅探題を置き、上皇方の所領に新補地頭を任命した。'},
{u:'d',e:'中世',t:'k',lv:'基本',q:'承久の乱の後、朝廷の監視と西国御家人の統轄のため京都に置かれた機関を何というか。',a:'六波羅探題',x:'北条泰時と時房が最初の探題となった。それまで京都に置かれていた京都守護に代わるもの。'},
{u:'d',e:'中世',t:'s',lv:'発展',s:'一、質券売買地の事……右、地領を以て或いは質券に入れ流し、或いは売買せしむるの条、御家人等侘傺の基なり。向後に於いては停止に従ふべし。以前沽却の分に至りては、本主之を取り返すべし。',src:'『東寺百合文書』',q:'1297年に出されたこの法令を何というか。',a:'永仁の徳政令',x:'困窮した御家人を救うため、所領の質入れ・売買を禁じ、売却済みの所領も元の持ち主が取り戻せるとした。かえって御家人は金融の道を断たれ、効果は一時的だった。'},
{u:'d',e:'中世',t:'k',lv:'標準',q:'『立正安国論』を著して前執権の北条時頼に提出し、法華経の信仰を説いた僧は誰か。',a:'日蓮',x:'他宗を激しく批判したため伊豆・佐渡に流された。開いた宗派は法華宗(日蓮宗)。'},
{u:'d',e:'中世',t:'k',lv:'基本',q:'1404年に始まった日明貿易で、倭寇と区別するために使われた証票を何というか。',a:'勘合',x:'足利義満が明の皇帝から「日本国王」として冊封を受けた朝貢形式の貿易。のちに細川氏と大内氏が貿易の主導権を争った(寧波の乱、1523年)。'},
{u:'d',e:'中世',t:'k',lv:'発展',q:'1510年、朝鮮の三つの港に住む日本人が起こした暴動を何というか。',a:'三浦の乱',x:'三浦は富山浦・乃而浦・塩浦。これ以降、日朝貿易は衰退した。'},
{u:'d',e:'中世',t:'k',lv:'標準',q:'戦国時代、堺の自治を担った豪商たちの組織を何というか。',a:'会合衆',x:'36人の会合衆が市政を運営した。博多では年行司と呼ばれる豪商が自治を行った。'},

{u:'d',e:'近世',t:'k',lv:'発展',q:'1715年、新井白石が金銀の流出を防ぐため、長崎での清・オランダとの貿易額を制限した法令を何というか。',a:'海舶互市新例',alt:['長崎新令','正徳新例'],x:'清船は年30隻・銀6000貫、オランダ船は年2隻・銀3000貫に制限した。'},

{u:'d',e:'近世',t:'k',lv:'基本',q:'1837年、天保の飢饉の中で貧民救済を掲げて大坂で挙兵した、元大坂町奉行所の与力は誰か。',a:'大塩平八郎',x:'陽明学者で私塾洗心洞を開いた。乱は1日で鎮圧されたが、幕府の元役人の反乱は大きな衝撃を与えた。同年、越後柏崎では生田万の乱が起きた。'},

{u:'d',e:'近代',t:'s',lv:'基本',s:'第一条　大日本帝国ハ万世一系ノ天皇之ヲ統治ス\n第三条　天皇ハ神聖ニシテ侵スヘカラス',src:'',q:'1889年2月11日に発布された、この条文をもつ憲法を何というか。',a:'大日本帝国憲法',alt:['明治憲法'],x:'天皇が定めて国民に与える欽定憲法。統帥権など議会が関与できない広い天皇大権が定められた。'},
{u:'d',e:'近代',t:'k',lv:'発展',q:'伊藤博文が憲法調査のためヨーロッパに渡った際、ウィーン大学で教えを受けた学者は誰か。',a:'シュタイン',x:'ベルリン大学のグナイストにも学んだ。君主権の強いドイツ(プロイセン)の憲法理論を参考にした。'},
{u:'d',e:'近代',t:'k',lv:'標準',q:'下関条約で得た遼東半島を清に返すよう日本に求めた三国干渉の3か国はどこか。',a:'ロシア・フランス・ドイツ',alt:['ロシアフランスドイツ','露仏独','ロシア、フランス、ドイツ'],x:'日本は「臥薪嘗胆」を合言葉に軍備を拡張した。のちにロシアは遼東半島の旅順・大連を租借した。'},
{u:'d',e:'近代',t:'k',lv:'標準',q:'1905年のポーツマス条約で日本の全権を務めた外務大臣は誰か。',a:'小村寿太郎',x:'ロシアの全権はウィッテ。賠償金が得られなかったことに国民が反発し、日比谷焼打ち事件が起きた。'},
{u:'d',e:'近代',t:'k',lv:'基本',q:'1915年、第2次大隈重信内閣が中国の袁世凱政府に突きつけた要求を何というか。',a:'二十一カ条の要求',alt:['二十一か条の要求','二十一箇条の要求','対華二十一カ条要求','21カ条の要求'],x:'山東省のドイツ権益の継承などを認めさせた。要求を受け入れた5月9日は中国で「国恥記念日」とされた。'},
{u:'d',e:'近代',t:'k',lv:'基本',q:'1932年、海軍青年将校らが首相官邸を襲い、犬養毅首相を暗殺した事件を何というか。',a:'五・一五事件',alt:['五一五事件','5.15事件'],x:'これにより政党内閣は途絶え、海軍大将斎藤実が挙国一致内閣を組織した。'},
{u:'d',e:'現代',t:'k',lv:'標準',q:'1956年、鳩山一郎首相が調印し、日本の国際連合加盟を実現させた文書を何というか。',a:'日ソ共同宣言',x:'ソ連と国交を回復し、平和条約締結後に歯舞群島・色丹島を引き渡すとされた。ソ連が国連加盟への反対をやめ、同年12月に日本は国連に加盟した。'},

{u:'n',e:'近世',t:'k',lv:'基本',q:'1825年に幕府が出した、清・オランダ以外の外国船を見つけ次第撃退するよう命じた法令を何というか。',a:'異国船打払令',alt:['無二念打払令'],x:'1842年、アヘン戦争で清がイギリスに敗れたことを知った幕府は、これを改めて薪水給与令を出した。'},
{u:'n',e:'近世',t:'k',lv:'標準',q:'加賀藩に仕えたのち5代将軍綱吉の侍講となり、新井白石や室鳩巣を育てた朱子学者は誰か。',a:'木下順庵',x:'京学の松永尺五に学んだ。門下の新井白石は6代家宣に登用され、正徳の政治を主導した。'},
{u:'n',e:'近世',t:'s',lv:'標準',s:'一　文武忠孝を励し、礼儀を正すべきの事。',src:'武家諸法度(天和令)',q:'1683年、武家諸法度の第一条をこのように改めた将軍は誰か。',a:'徳川綱吉',x:'それまでの第一条「文武弓馬の道、専ら相嗜むべき事」から、主君への忠と親への孝、礼儀を重んじる内容に変わった。武断政治から文治政治への転換を示す条文。'},
{u:'n',e:'近世',t:'k',lv:'標準',q:'17世紀後半に多く見られた、村の代表者が百姓全体の要求を領主や幕府に直訴する形の一揆を何というか。',a:'代表越訴型一揆',x:'下総の佐倉惣五郎が代表例として伝えられる。18世紀になると、村全体の百姓が参加する惣百姓一揆が広がった。'},
{u:'n',e:'近世',t:'k',lv:'基本',q:'1862年、島津久光の行列を横切ったイギリス人を薩摩藩士が殺傷した事件を何というか。',a:'生麦事件',x:'翌1863年、イギリス艦隊が鹿児島を攻撃した(薩英戦争)。これを機に薩摩藩は攘夷が不可能だと悟り、イギリスに接近した。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'1872年に群馬県で操業を始めた、フランスの技術を導入した官営模範工場を何というか。',a:'富岡製糸場',x:'殖産興業政策の代表例。全国から集まった工女が技術を学び、各地に広めた。2014年に世界遺産に登録された。'},
{u:'n',e:'近代',t:'k',lv:'標準',q:'関東大震災で決済できなくなり、日本銀行が特別融資で処理した手形を何というか。',a:'震災手形',x:'その処理をめぐる議会審議中の片岡直温蔵相の失言から、1927年に金融恐慌が起きた。'},
{u:'n',e:'近代',t:'k',lv:'基本',q:'1940年、新体制運動の中で政党が解散して合流し、結成された組織を何というか。',a:'大政翼賛会',x:'第2次近衛文麿内閣のもとで結成され、総裁は首相が務めた。部落会・町内会・隣組が下部組織となった。'},
{u:'n',e:'現代',t:'k',lv:'基本',q:'1945年10月、マッカーサーが幣原喜重郎首相に口頭で指示した5つの民主化の改革を何というか。',a:'五大改革指令',alt:['五大改革'],x:'女性の解放(参政権)、労働組合の結成奨励、教育の自由主義化、圧政的諸制度の撤廃、経済機構の民主化の5つ。'},
{u:'n',e:'現代',t:'s',lv:'基本',s:'日本国民は、正義と秩序を基調とする国際平和を誠実に希求し、国権の発動たる戦争と、武力による威嚇又は武力の行使は、国際紛争を解決する手段としては、永久にこれを放棄する。',src:'',q:'この条文をもつ法は何か。',a:'日本国憲法',x:'第9条第1項。1946年11月3日に公布、1947年5月3日に施行された。国民主権・基本的人権の尊重・平和主義を三原則とする。'},
{u:'n',e:'現代',t:'k',lv:'標準',q:'高度経済成長期の公害の深刻化を受け、1967年に制定された公害対策の基本となる法律を何というか。',a:'公害対策基本法',x:'1971年には環境庁が発足した。水俣病・新潟水俣病・イタイイタイ病・四日市ぜんそくの四大公害訴訟は、いずれも被害者側が勝訴した。'},
{u:'n',e:'現代',t:'k',lv:'基本',q:'1973年、第4次中東戦争をきっかけに原油価格が急騰し、日本経済が混乱した出来事を何というか。',a:'第1次石油危機',alt:['石油危機','オイルショック','第一次石油危機','第1次オイルショック'],x:'狂乱物価と呼ばれるインフレが起き、1974年には戦後初のマイナス成長となった。高度経済成長はここで終わった。'},

{u:'r',e:'近世',t:'k',lv:'標準',q:'1643年、本百姓の没落を防ぐため、田畑の売買を禁じた法令を何というか。',a:'田畑永代売買の禁止令',alt:['田畑永代売買禁止令','田畑永代売買の禁令','田畑永代売買の禁'],x:'寛永の飢饉の後に出された。1673年の分地制限令とあわせ、年貢を負担する本百姓の経営を守るねらいがあった。'},
{u:'r',e:'近世',t:'k',lv:'標準',q:'1673年、田畑の細分化を防ぐため、分割相続を制限した法令を何というか。',a:'分地制限令',x:'名主は20石以上、一般の百姓は10石以上の田畑をもたなければ分割相続を認めないとした。'},
{u:'r',e:'近世',t:'k',lv:'基本',q:'享保の改革で、庶民の意見を投書させるため評定所の前に置かれた箱を何というか。',a:'目安箱',x:'投書をもとに、貧しい病人のための小石川養生所がつくられた。'},
{u:'r',e:'近世',t:'k',lv:'標準',q:'8代将軍吉宗のもとで1742年に完成した、裁判や刑罰の基準を定めた法典を何というか。',a:'公事方御定書',x:'下巻は「御定書百箇条」と呼ばれる。判例に基づいて刑罰を定め、裁判の公正と迅速化をめざした。'},
{u:'r',e:'近世',t:'k',lv:'標準',q:'田沼意次が新田開発のため干拓を進めたが、利根川の洪水で中止された下総の沼を何というか。',a:'印旛沼',x:'田沼は手賀沼の干拓も進めた。印旛沼の工事は天保の改革で水野忠邦も試みたが、失敗した。'},
{u:'r',e:'近世',t:'k',lv:'発展',q:'寛政の改革で、困窮した旗本・御家人を救うため、札差からの借金を帳消しにさせた法令を何というか。',a:'棄捐令',x:'6年以上前の借金は帳消し、それ以降の分は低利で年賦返済とした。札差は以後の貸し渋りで対抗した。'},
{u:'r',e:'近世',t:'s',lv:'標準',s:'朱学の儀は、慶長以来御代々御信用の御事にて、已に其方家代々右学風維持の事仰付置かれ候儀に候得共……此度聖堂御取締厳重に仰付けられ……',src:'『徳川禁令考』',q:'1790年、松平定信が林家に対して出したこの命令を何というか。',a:'寛政異学の禁',x:'朱子学を正学とし、聖堂学問所で他の学派の講義を禁じた。のちに聖堂学問所は幕府直轄の昌平坂学問所となった。'},
{u:'r',e:'近世',t:'k',lv:'基本',q:'1854年、ペリーとの間で結ばれ、下田・箱館の2港を開いた条約を何というか。',a:'日米和親条約',alt:['神奈川条約'],x:'アメリカ船への燃料・食料の供給や、一方的な最恵国待遇を認めた。貿易の規定はまだなかった。'},
{u:'r',e:'近代',t:'k',lv:'基本',q:'1869年、藩主が領地と領民を天皇に返上したことを何というか。',a:'版籍奉還',x:'旧藩主はそのまま知藩事に任命されたため、実態はあまり変わらなかった。1871年の廃藩置県で中央集権体制が整った。'},
{u:'r',e:'近代',t:'k',lv:'基本',q:'1873年に出された、満20歳以上の男子に兵役を課した法令を何というか。',a:'徴兵令',x:'大村益次郎が構想し、山県有朋が実現した。戸主や長男などには免除規定があり、各地で血税一揆が起きた。'},
{u:'r',e:'近代',t:'k',lv:'標準',q:'1880年、愛国社を中心に結成され、国会開設の請願書を提出した組織を何というか。',a:'国会期成同盟',x:'政府は請願を受け付けず、同年に集会条例を出して運動を取り締まった。'},
{u:'r',e:'近代',t:'k',lv:'発展',q:'1887年、三大事件建白運動の高まりに対し、民権派を東京から追放した法令を何というか。',a:'保安条例',x:'三大事件とは、地租の軽減・言論集会の自由・外交失策の挽回(条約改正問題)の3つの要求。尾崎行雄・中江兆民らが追放された。'},
{u:'r',e:'近代',t:'k',lv:'発展',q:'1897年、高野房太郎・片山潜らが結成し、労働組合の結成を促した団体を何というか。',a:'労働組合期成会',x:'この運動に対し、政府は1900年に治安警察法を制定して労働運動を取り締まった。'},
{u:'r',e:'近代',t:'k',lv:'標準',q:'1910年、天皇暗殺を計画したとして多くの社会主義者・無政府主義者が検挙され、幸徳秋水らが処刑された事件を何というか。',a:'大逆事件',x:'この後、社会主義運動は「冬の時代」に入った。同じ年に韓国併合が行われている。'},
{u:'r',e:'近代',t:'k',lv:'標準',q:'1927年、片岡直温蔵相の失言をきっかけに銀行への取り付け騒ぎが広がった出来事を何というか。',a:'金融恐慌',x:'若槻礼次郎内閣は台湾銀行救済の緊急勅令を枢密院に否決されて総辞職した。次の田中義一内閣がモラトリアム(支払猶予令)で収めた。'},
{u:'r',e:'近代',t:'k',lv:'標準',q:'1930年、浜口雄幸内閣の井上準之助蔵相が実施した、金の輸出を再び自由にした政策を何というか。',a:'金解禁',alt:['金輸出解禁'],x:'旧平価(実勢より円高)で行ったうえ、世界恐慌と重なったため昭和恐慌を招いた。1931年、犬養毅内閣の高橋是清蔵相が金輸出を再禁止した。'},
{u:'r',e:'近代',t:'k',lv:'発展',q:'1935年、天皇機関説が攻撃されたことを受け、岡田啓介内閣が出した声明を何というか。',a:'国体明徴声明',x:'天皇機関説を否定する声明で、美濃部達吉の著書は発禁となり、美濃部は貴族院議員を辞職した。'},
{u:'r',e:'近代',t:'s',lv:'標準',s:'第一款　朝鮮国ハ自主ノ邦ニシテ日本国ト平等ノ権ヲ保有セリ',src:'',q:'1876年、江華島事件を機に日本が朝鮮と結んだこの条約を何というか。',a:'日朝修好条規',alt:['江華条約'],x:'朝鮮を「自主の邦」とするのは清の宗主権を否定するねらい。釜山など3港の開港や日本の領事裁判権を認めさせた不平等条約だった。'},
{u:'r',e:'現代',t:'k',lv:'標準',q:'1947年に制定され、教育の機会均等や9年間の義務教育を定めた法律を何というか。',a:'教育基本法',x:'同時に学校教育法が制定され、六・三・三・四制が始まった。2006年に全面改正された。'},
{u:'r',e:'現代',t:'k',lv:'基本',q:'1950年、朝鮮戦争の勃発を受けてGHQの指令で発足し、のちに保安隊・自衛隊へと改組された組織を何というか。',a:'警察予備隊',x:'1952年に保安隊、1954年のMSA協定締結を経て自衛隊となった。'},
{u:'r',e:'現代',t:'k',lv:'標準',q:'1968年、佐藤栄作内閣のもとで日本に返還された島々はどこか。',a:'小笠原諸島',x:'沖縄は1972年に返還された。佐藤内閣は「核兵器をもたず、つくらず、もち込ませず」の非核三原則を掲げた。'},

{u:'d',e:'近世',t:'k',lv:'標準',q:'1613年、伊達政宗が支倉常長をスペインに派遣した使節を何というか。',a:'慶長遣欧使節',x:'メキシコとの直接貿易をめざしたが、目的は果たせなかった。帰国した1620年にはキリスト教の禁止が強まっていた。'},
{u:'d',e:'近世',t:'s',lv:'標準',s:'一　自今以後、かれうた渡海の儀、之を停止せられ畢。此上若し差渡るニおゐてハ、其船を破却し、并乗来る者速に斬罪に処せらるべき旨、仰せ出さるる所也。',src:'『御当家令条』',q:'1639年のこの法令で来航が禁止された「かれうた」は、どこの国の船か。',a:'ポルトガル',alt:['ポルトガル船'],x:'島原・天草一揆の後に出された。1641年にはオランダ商館が平戸から長崎の出島に移され、いわゆる鎖国体制が完成した。'},
{u:'d',e:'近世',t:'k',lv:'基本',q:'1641年、平戸からオランダ商館が移された長崎の人工島を何というか。',a:'出島',x:'もとはポルトガル人を収容するために築かれた。オランダ商館長はオランダ風説書を幕府に提出し、海外情報を伝えた。'},
{u:'d',e:'近世',t:'k',lv:'標準',q:'1720年、キリスト教に関係のない漢訳洋書の輸入制限を緩めた将軍は誰か。',a:'徳川吉宗',x:'青木昆陽・野呂元丈にオランダ語を学ばせ、蘭学の発展のきっかけとなった。'},
{u:'d',e:'近世',t:'k',lv:'基本',q:'前野良沢・杉田玄白らがオランダ語の解剖書を翻訳し、1774年に刊行した書物を何というか。',a:'解体新書',x:'原書はドイツ人の書いた解剖書のオランダ語訳『ターヘル・アナトミア』。翻訳の苦労は杉田玄白の『蘭学事始』に記されている。'},
{u:'d',e:'近世',t:'k',lv:'発展',q:'モリソン号事件での幕府の対応を『戊戌夢物語』で批判し、蛮社の獄で処罰された蘭学者は誰か。',a:'高野長英',x:'同じく『慎機論』を著した渡辺崋山も処罰された。二人は尚歯会(蛮社)の中心人物だった。'},

// ===== 状態 =====
const UNIV = {all:'すべて',d:'同志社',r:'立命館',n:'南山'};
const ERAS = ['すべて','古代','中世','近世','近代','現代'];
const TYPES = {all:'すべて',k:'一問一答',s:'史料問題',miss:'間違えた問題'};
const KEY = 'nihonshi-drill-v1';
let state = {u:'all', e:'すべて', t:'all'};
let rec = {};           // 問題番号 → {c:正解数, w:不正解数, last:直近の正誤}
try{ rec = JSON.parse(localStorage.getItem(KEY)||'{}') }catch(_){ rec = {} }
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(rec)) }catch(_){} };

let current = -1, lastShown = -1, answered = false, lastResult = null;

// ===== 条件チップ =====
function chips(id, entries, key){
  const box = document.getElementById(id);
  box.innerHTML = '';
  entries.forEach(([val,label])=>{
    const b = document.createElement('button');
    b.className='chip'; b.type='button'; b.textContent=label;
    b.setAttribute('aria-pressed', state[key]===val);
    b.onclick = ()=>{ state[key]=val; renderFilters(); next(); };
    box.appendChild(b);
  });
}
function renderFilters(){
  chips('f-u', Object.entries(UNIV), 'u');
  chips('f-e', ERAS.map(x=>[x,x]), 'e');
  chips('f-t', Object.entries(TYPES), 't');
  renderStats();
}
function pool(){
  return Q.map((q,i)=>i).filter(i=>{
    const q = Q[i];
    if(state.u!=='all' && q.u!==state.u) return false;
    if(state.e!=='すべて' && q.e!==state.e) return false;
    if(state.t==='miss') return rec[i] && rec[i].last===false;
    if(state.t!=='all' && q.t!==state.t) return false;
    return true;
  });
}
function renderStats(){
  const p = pool();
  let c=0,w=0; p.forEach(i=>{ if(rec[i]){ c+=rec[i].c; w+=rec[i].w } });
  const tried = p.filter(i=>rec[i]).length;
  const miss = Q.filter((_,i)=>rec[i] && rec[i].last===false).length;
  const rate = c+w ? Math.round(c/(c+w)*100)+'%' : '—';
  document.getElementById('stats').innerHTML =
    `<span>対象 <b>${p.length}</b>問</span><span>解いた <b>${tried}</b>問</span><span>正答率 <b>${rate}</b></span><span>要復習 <b>${miss}</b>問</span>`;
}

// ===== 採点 =====
const norm = s => (s||'').normalize('NFKC').replace(/[\s・、,，.。「」『』()（）\-ー〜~=＝]/g,'').replace(/ヶ|ケ/g,'カ');
function judge(input, q){
  const n = norm(input); if(!n) return false;
  return [q.a, ...(q.alt||[])].some(x=>norm(x)===n);
}

// ===== 表示 =====
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function next(){
  const p = pool();
  const card = document.getElementById('card');
  if(!p.length){
    card.innerHTML = `<p class="empty">${state.t==='miss' ? '間違えた問題はまだありません。' : 'この条件の問題はありません。条件を変えてください。'}</p>`;
    current=-1; renderStats(); return;
  }
  let i; do{ i = p[Math.floor(Math.random()*p.length)] }while(p.length>1 && i===lastShown);
  current = lastShown = i; answered=false; lastResult=null;
  const q = Q[i];
  card.innerHTML = `
    <div class="meta"><span class="tag u ${q.u}">${UNIV[q.u]}</span><span class="tag">${q.e}</span><span class="tag">${q.t==='s'?'史料':'一問一答'}</span><span class="lv">${q.lv}</span></div>
    ${q.s ? `<div class="shiryo">${esc(q.s).replace(/\n/g,'<br>')}${q.src?`<cite>${esc(q.src)}</cite>`:''}</div>` : ''}
    <p class="q">${esc(q.q)}</p>
    <form class="answer-row" id="f"><label for="ans" hidden>解答</label><input type="text" id="ans" autocomplete="off" placeholder="漢字で答えを入力"><button class="btn" type="submit">答え合わせ</button></form>
    <div class="actions"><button class="btn ghost small" type="button" id="reveal">答えを見る</button><button class="btn ghost small" type="button" id="skip">別の問題</button></div>
    <div id="res"></div>`;
  document.getElementById('f').onsubmit = e=>{ e.preventDefault(); grade(document.getElementById('ans').value) };
  document.getElementById('reveal').onclick = ()=>grade(null);
  document.getElementById('skip').onclick = next;
  renderStats();
}
function setRec(i, ok, prev){
  const r = rec[i] || {c:0,w:0,last:null};
  if(prev===true) r.c--; else if(prev===false) r.w--;
  if(ok) r.c++; else r.w++;
  r.last = ok; rec[i]=r; save();
}
function grade(input){
  if(answered || current<0) return;
  answered = true;
  const q = Q[current];
  const ok = input===null ? false : judge(input,q);
  setRec(current, ok, null); lastResult = ok;
  showResult(input, ok);
}
function showResult(input, ok){
  const q = Q[current];
  const res = document.getElementById('res');
  const yours = input===null ? '答えを見ました' : `あなたの答え:${esc(input)||'(未入力)'}`;
  res.innerHTML = `
    <div class="result ${ok?'ok':'ng'}">
      <div class="verdict"><span class="mark">${ok?'○':'×'}</span><span class="correct">${esc(q.a)}</span></div>
      <span class="yours">${yours}${q.alt&&q.alt.length?` / 別解:${q.alt.map(esc).join('、')}`:''}</span>
      <p class="exp">${esc(q.x)}</p>
      <div class="fix"><span>判定を直す:</span><button class="btn ghost small" type="button" id="flip">${ok?'×にする':'○にする'}</button></div>
    </div>
    <div class="actions" style="margin-top:12px"><button class="btn" type="button" id="nx">次の問題</button></div>`;
  document.getElementById('nx').onclick = next;
  document.getElementById('flip').onclick = ()=>{ const nv=!lastResult; setRec(current, nv, lastResult); lastResult=nv; showResult(input, nv); renderStats(); };
  document.getElementById('nx').focus();
  renderStats();
}

renderFilters();
next();
</script>
